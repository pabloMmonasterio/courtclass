function LoginScreen({ onLogged }) {
  const [modo, setModo] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);
  const [aviso, setAviso] = useState("");

  const submit = async () => {
    setError("");
    setAviso("");

    if (modo === "recover") {
      if (!email.trim()) { setError("Ingresá tu email."); return; }
      setCargando(true);
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: window.location.origin + window.location.pathname,
        });
        if (error) setError(error.message);
        else setAviso("Listo, te mandamos un email con el link para elegir una nueva contraseña.");
      } catch (e) {
        setError("Ocurrió un error. Probá de nuevo.");
      } finally {
        setCargando(false);
      }
      return;
    }

    if (!email.trim() || !password) {
      setError("Completá email y contraseña.");
      return;
    }
    setCargando(true);
    try {
      if (modo === "login") {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
        if (error) {
          setError(error.message === "Invalid login credentials" ? "Email o contraseña incorrectos." : error.message);
        } else if (data.session) {
          onLogged(data.session);
        }
      } else {
        const { data, error } = await supabaseClient.auth.signUp({ email: email.trim(), password });
        if (error) {
          setError(error.message);
        } else if (data.session) {
          onLogged(data.session);
        } else {
          setAviso("Si ese email es nuevo, te llegará un correo para confirmarlo. Si ya tenías cuenta, no se modificó nada: iniciá sesión con tu contraseña de siempre.");
        }
      }
    } catch (e) {
      setError("Ocurrió un error. Probá de nuevo.");
    } finally {
      setCargando(false);
    }
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: COLORS.court,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif",
        padding: 20,
      }}
    >
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 380 }}>
        <div style={{ fontSize: 12, letterSpacing: 2, color: COLORS.court, fontWeight: 800, textTransform: "uppercase", marginBottom: 4 }}>
          CourtClass
        </div>
        <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 20, color: COLORS.ink }}>
          {modo === "login" ? "Ingresá a tu cuenta" : modo === "signup" ? "Creá tu cuenta" : "Recuperar contraseña"}
        </div>

        <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 6, textTransform: "uppercase" }}>Email</div>
        <input
          type="email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="tu@email.com"
          style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 12, boxSizing: "border-box" }}
        />

        {modo !== "recover" && (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 6, textTransform: "uppercase" }}>Contraseña</div>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 16, boxSizing: "border-box" }}
            />
          </>
        )}

        {error && <div style={{ color: "#B23A3A", fontSize: 13, marginBottom: 12, fontWeight: 600 }}>{error}</div>}
        {aviso && <div style={{ color: COLORS.court, fontSize: 13, marginBottom: 12, fontWeight: 600 }}>{aviso}</div>}

        <button
          onClick={submit}
          disabled={cargando}
          style={{ width: "100%", background: COLORS.court, color: "#fff", border: "none", padding: "13px 0", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer", opacity: cargando ? 0.6 : 1 }}
        >
          {cargando ? "Un momento..." : modo === "login" ? "Ingresar" : modo === "signup" ? "Crear cuenta" : "Enviar link de recuperación"}
        </button>

        {modo === "login" && (
          <button
            onClick={() => { setModo("recover"); setError(""); setAviso(""); }}
            style={{ width: "100%", background: "none", border: "none", color: COLORS.inkSoft, fontSize: 12.5, fontWeight: 600, padding: "12px 0 0", cursor: "pointer" }}
          >
            ¿Olvidaste tu contraseña?
          </button>
        )}

        <button
          onClick={() => { setModo(modo === "login" ? "signup" : "login"); setError(""); setAviso(""); }}
          style={{ width: "100%", background: "none", border: "none", color: COLORS.court, fontSize: 13, fontWeight: 700, padding: "10px 0 0", cursor: "pointer" }}
        >
          {modo === "login" ? "¿No tenés cuenta? Creala acá" : modo === "signup" ? "¿Ya tenés cuenta? Ingresá" : "Volver a ingresar"}
        </button>
      </div>
    </div>
  );
}

function SetNewPasswordScreen({ onDone }) {
  const [password, setPassword] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);
  const [ok, setOk] = useState(false);

  const submit = async () => {
    setError("");
    if (password.length < 6) { setError("La contraseña debe tener al menos 6 caracteres."); return; }
    if (password !== confirmar) { setError("Las contraseñas no coinciden."); return; }
    setCargando(true);
    const { error } = await supabaseClient.auth.updateUser({ password });
    setCargando(false);
    if (error) setError(error.message);
    else setOk(true);
  };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.court, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 380 }}>
        <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 18, color: COLORS.ink }}>Elegí tu nueva contraseña</div>
        {ok ? (
          <>
            <div style={{ color: COLORS.court, fontSize: 14, fontWeight: 600, marginBottom: 18 }}>Contraseña actualizada correctamente.</div>
            <button onClick={onDone} style={{ width: "100%", background: COLORS.court, color: "#fff", border: "none", padding: "13px 0", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
              Continuar
            </button>
          </>
        ) : (
          <>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="Nueva contraseña"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 12, boxSizing: "border-box" }}
            />
            <input
              type="password"
              value={confirmar}
              onChange={(e) => setConfirmar(e.target.value)}
              placeholder="Repetir contraseña"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 16, boxSizing: "border-box" }}
            />
            {error && <div style={{ color: "#B23A3A", fontSize: 13, marginBottom: 12, fontWeight: 600 }}>{error}</div>}
            <button
              onClick={submit}
              disabled={cargando}
              style={{ width: "100%", background: COLORS.court, color: "#fff", border: "none", padding: "13px 0", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer", opacity: cargando ? 0.6 : 1 }}
            >
              {cargando ? "Un momento..." : "Guardar nueva contraseña"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function AccountModal({ session, onClose }) {
  const [modoPass, setModoPass] = useState(false);
  const [password, setPassword] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [error, setError] = useState("");
  const [aviso, setAviso] = useState("");
  const [cargando, setCargando] = useState(false);

  const cambiarPassword = async () => {
    setError(""); setAviso("");
    if (password.length < 6) { setError("La contraseña debe tener al menos 6 caracteres."); return; }
    if (password !== confirmar) { setError("Las contraseñas no coinciden."); return; }
    setCargando(true);
    const { error } = await supabaseClient.auth.updateUser({ password });
    setCargando(false);
    if (error) setError(error.message);
    else { setAviso("Contraseña actualizada."); setPassword(""); setConfirmar(""); setModoPass(false); }
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", display: "flex", alignItems: "flex-end", zIndex: 300 }} onClick={onClose}>
      <div style={{ background: COLORS.bg, width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "18px 18px 0 0", padding: 20, paddingBottom: 32 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <div style={{ fontWeight: 800, fontSize: 17 }}>Mi cuenta</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", fontSize: 18 }}>✕</button>
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.inkSoft, textTransform: "uppercase", marginBottom: 4 }}>Email</div>
        <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>{session.user.email}</div>

        {!modoPass ? (
          <button
            onClick={() => setModoPass(true)}
            style={{ width: "100%", background: "#fff", border: `1px solid ${COLORS.line}`, padding: "12px 0", borderRadius: 12, fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 10 }}
          >
            Cambiar contraseña
          </button>
        ) : (
          <div style={{ marginBottom: 14 }}>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="Nueva contraseña"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 8, boxSizing: "border-box" }}
            />
            <input
              type="password"
              value={confirmar}
              onChange={(e) => setConfirmar(e.target.value)}
              placeholder="Repetir contraseña"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 10, boxSizing: "border-box" }}
            />
            {error && <div style={{ color: "#B23A3A", fontSize: 13, marginBottom: 8, fontWeight: 600 }}>{error}</div>}
            <button
              onClick={cambiarPassword}
              disabled={cargando}
              style={{ width: "100%", background: COLORS.court, color: "#fff", border: "none", padding: "12px 0", borderRadius: 12, fontSize: 14, fontWeight: 700, cursor: "pointer", opacity: cargando ? 0.6 : 1 }}
            >
              {cargando ? "Un momento..." : "Guardar nueva contraseña"}
            </button>
          </div>
        )}

        {aviso && <div style={{ color: COLORS.court, fontSize: 13, marginBottom: 14, fontWeight: 600 }}>{aviso}</div>}

        <button
          onClick={() => supabaseClient.auth.signOut()}
          style={{ width: "100%", background: "none", border: `1px solid #B23A3A`, color: "#B23A3A", padding: "12px 0", borderRadius: 12, fontSize: 14, fontWeight: 700, cursor: "pointer" }}
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [showAccount, setShowAccount] = useState(false);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session || null);
      currentUserId = data.session ? data.session.user.id : null;
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, nuevaSession) => {
      setSession(nuevaSession);
      currentUserId = nuevaSession ? nuevaSession.user.id : null;
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bg, fontFamily: "system-ui" }}>
        <div style={{ color: COLORS.inkSoft }}>Cargando...</div>
      </div>
    );
  }

  if (recoveryMode && session) {
    return <SetNewPasswordScreen onDone={() => setRecoveryMode(false)} />;
  }

  if (!session) {
    return <LoginScreen onLogged={(s) => { setSession(s); currentUserId = s.user.id; }} />;
  }

  return (
    <>
      <App key={session.user.id} onOpenAccount={() => setShowAccount(true)} />
      {showAccount && <AccountModal session={session} onClose={() => setShowAccount(false)} />}
    </>
  );
}



const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
</body>
</html>
