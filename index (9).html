const { useState, useEffect, useCallback } = React;

const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const DIAS_CORTO = ["DOM", "LUN", "MAR", "MIE", "JUE", "VIE", "SAB"];

const COLORS = {
  bg: "#F5F3EE",
  court: "#1F5C4E",
  courtDark: "#153E34",
  clay: "#C1662E",
  clayLight: "#F1DCC9",
  ink: "#1C231F",
  inkSoft: "#5C6660",
  line: "#DAD5C8",
  card: "#FFFFFF",
};

const CLUB_COLORS = ["#1F5C4E", "#C1662E", "#3B6E8F", "#7A4FA3", "#B23A3A"];

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function loadData() {
  return { alumnos: [], clases: [], clubes: [], disponibilidad: [], disponibilidadExcepciones: {} };
}

const noCacheFetch = (url, options = {}) =>
  fetch(url, { ...options, cache: "no-store", headers: { ...(options.headers || {}), "Cache-Control": "no-cache" } });

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  global: { fetch: noCacheFetch },
});

let currentUserId = null;

function mergeConDefaults(d) {
  return { alumnos: [], clases: [], clubes: [], disponibilidad: [], disponibilidadExcepciones: {}, ...(d || {}) };
}

async function persist(data) {
  if (!currentUserId) return;
  try {
    const { error } = await supabaseClient
      .from("estado_app")
      .upsert({ user_id: currentUserId, data, actualizado_en: new Date().toISOString() }, { onConflict: "user_id" });
    if (error) console.error("No se pudo guardar", error);
  } catch (e) {
    console.error("No se pudo guardar", e);
  }
}

async function leerFilaUsuario() {
  const { data: filas, error } = await supabaseClient
    .from("estado_app")
    .select("data")
    .eq("user_id", currentUserId);
  if (error) throw error;
  return filas && filas.length > 0 ? filas[0] : null;
}

async function fetchData() {
  if (!currentUserId) return loadData();
  try {
    const fila = await leerFilaUsuario();
    if (fila) return mergeConDefaults(fila.data);

    // No existe fila: la creamos con INSERT puro (nunca upsert acá),
    // para que sea imposible pisar una fila real por una lectura tardía.
    const inicial = loadData();
    const { error: insertError } = await supabaseClient.from("estado_app").insert({ user_id: currentUserId, data: inicial });

    if (insertError) {
      // Probablemente la fila SI existia (condicion de carrera): releemos en vez de asumir vacio.
      try {
        const filaReintento = await leerFilaUsuario();
        if (filaReintento) return mergeConDefaults(filaReintento.data);
      } catch (e2) {
        console.error("Error releyendo datos", e2);
      }
    }
    return inicial;
  } catch (e) {
    console.error("Error leyendo datos", e);
    return loadData();
  }
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d;
}

function fmtMoney(n) {
  return "$" + Number(n || 0).toLocaleString("es-AR");
}

function calcularGanancia(c) {
  if (c.montoFijo != null && c.montoFijo !== "") return Number(c.montoFijo);
  return (Number(c.precio || 0) * Number(c.porcentaje || 100)) / 100;
}

function fmtDateShort(d) {
  return d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" });
}

function addMinutos(hora, minutos) {
  const [h, m] = hora.split(":").map(Number);
  const total = h * 60 + m + minutos;
  const hh = Math.floor(((total % 1440) + 1440) % 1440 / 60);
  const mm = ((total % 60) + 60) % 60;
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

function rangosSuperponen(inicioA, finA, inicioB, finB) {
  return inicioA < finB && inicioB < finA;
}

function linkWhatsApp(telefono, mensaje) {
  const limpio = (telefono || "").replace(/[^\d]/g, "");
  return `https://wa.me/${limpio}?text=${encodeURIComponent(mensaje)}`;
}

function fmtFechaLarga(fechaISO) {
  const d = new Date(fechaISO + "T00:00:00");
  const texto = d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function fmtFechaHoraLarga(fechaISO, hora) {
  return `${fmtFechaLarga(fechaISO)} a las ${hora}`;
}

function toISODateLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function fechasDelMesPorDiaSemana(fechaBase) {
  const [y, m, day] = fechaBase.split("-").map(Number);
  const base = new Date(y, m - 1, day);
  const weekday = base.getDay();
  const fechas = [];
  const cursor = new Date(y, m - 1, 1);
  while (cursor.getMonth() === m - 1) {
    if (cursor.getDay() === weekday && cursor >= base) {
      fechas.push(toISODateLocal(cursor));
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return fechas;
}

function App({ onOpenAccount } = {}) {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("agenda");
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [showAddClase, setShowAddClase] = useState(false);
  const [showAddAlumno, setShowAddAlumno] = useState(false);
  const [editandoAlumno, setEditandoAlumno] = useState(null);
  const [showAddClub, setShowAddClub] = useState(false);
  const [editandoClubInfo, setEditandoClubInfo] = useState(null);
  const [reprogramando, setReprogramando] = useState(null);
  const [cancelando, setCancelando] = useState(null);
  const [editandoClub, setEditandoClub] = useState(null);
  const [verAlumno, setVerAlumno] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    fetchData().then((d) => setData(d));
  }, []);

  const save = useCallback((next) => {
    setData(next);
    persist(next);
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  };

  if (!data) {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui" }}>
        <div style={{ color: COLORS.inkSoft }}>Cargando...</div>
      </div>
    );
  }

  const addAlumno = (nombre, contacto, clubId) => {
    const alumno = { id: uid(), nombre, contacto, clubId: clubId || null };
    save({ ...data, alumnos: [...data.alumnos, alumno] });
    showToast("Alumno agregado");
  };

  const deleteAlumno = (id) => {
    save({ ...data, alumnos: data.alumnos.filter((a) => a.id !== id) });
  };

  const updateAlumno = (id, cambios) => {
    save({ ...data, alumnos: data.alumnos.map((a) => (a.id === id ? { ...a, ...cambios } : a)) });
    showToast("Alumno actualizado");
  };

  const addClub = (info) => {
    const colorIndex = (data.clubes || []).length % CLUB_COLORS.length;
    const club = { id: uid(), color: CLUB_COLORS[colorIndex], ...info };
    save({ ...data, clubes: [...(data.clubes || []), club] });
    showToast("Club agregado");
  };

  const updateClub = (id, cambios) => {
    save({ ...data, clubes: data.clubes.map((c) => (c.id === id ? { ...c, ...cambios } : c)) });
    showToast("Club actualizado");
  };

  const toggleDisponibilidad = (dia, hora) => {
    const key = `${dia}-${hora}`;
    const actual = data.disponibilidad || [];
    const nueva = actual.includes(key) ? actual.filter((k) => k !== key) : [...actual, key];
    save({ ...data, disponibilidad: nueva });
  };

  const limpiarDisponibilidadDia = (dia) => {
    const actual = data.disponibilidad || [];
    const nueva = actual.filter((k) => !k.startsWith(`${dia}-`));
    save({ ...data, disponibilidad: nueva });
  };

  const marcarDiaCompletoDisponible = (dia, horas) => {
    const actual = (data.disponibilidad || []).filter((k) => !k.startsWith(`${dia}-`));
    const nuevas = horas.map((h) => `${dia}-${h}`);
    save({ ...data, disponibilidad: [...actual, ...nuevas] });
  };

  const toggleExcepcion = (fecha, diaSemana, hora) => {
    const key = `${fecha}-${hora}`;
    const patronBase = (data.disponibilidad || []).includes(`${diaSemana}-${hora}`);
    const excepciones = { ...(data.disponibilidadExcepciones || {}) };
    const actual = excepciones[key];
    const efectivoActual = actual === "on" ? true : actual === "off" ? false : patronBase;
    const nuevoEfectivo = !efectivoActual;
    if (nuevoEfectivo === patronBase) {
      delete excepciones[key];
    } else {
      excepciones[key] = nuevoEfectivo ? "on" : "off";
    }
    save({ ...data, disponibilidadExcepciones: excepciones });
  };

  const setExcepcionDiaCompleto = (fecha, diaSemana, horas, forzarOn) => {
    const excepciones = { ...(data.disponibilidadExcepciones || {}) };
    horas.forEach((h) => {
      const key = `${fecha}-${h}`;
      const patronBase = (data.disponibilidad || []).includes(`${diaSemana}-${h}`);
      if (forzarOn === patronBase) delete excepciones[key];
      else excepciones[key] = forzarOn ? "on" : "off";
    });
    save({ ...data, disponibilidadExcepciones: excepciones });
  };

  const limpiarExcepcionesDia = (fecha) => {
    const excepciones = { ...(data.disponibilidadExcepciones || {}) };
    Object.keys(excepciones).forEach((key) => {
      if (key.startsWith(`${fecha}-`)) delete excepciones[key];
    });
    save({ ...data, disponibilidadExcepciones: excepciones });
  };

  const deleteClub = (id) => {
    save({
      ...data,
      clubes: data.clubes.filter((c) => c.id !== id),
      clases: data.clases.map((c) => (c.clubId === id ? { ...c, clubId: null } : c)),
    });
  };

  const addClase = (payload) => {
    const nuevosAlumnos = payload.nuevosAlumnos || [];
    const alumnosActualizados = nuevosAlumnos.length > 0 ? [...data.alumnos, ...nuevosAlumnos] : data.alumnos;

    if (payload.multiple) {
      const { fechas, abonoId, nuevosAlumnos: _drop, ...resto } = payload;
      const nuevas = fechas.map((fecha) => ({
        ...resto,
        fecha,
        id: uid(),
        cobrado: false,
        reprogramada: null,
        estado: "programada",
        cancelacion: null,
        asistencia: null,
        abonoId,
      }));
      save({ ...data, alumnos: alumnosActualizados, clases: [...data.clases, ...nuevas] });
      showToast(`${nuevas.length} clases del abono agendadas`);
    } else {
      const { nuevosAlumnos: _drop, ...resto } = payload;
      save({
        ...data,
        alumnos: alumnosActualizados,
        clases: [
          ...data.clases,
          { ...resto, id: uid(), cobrado: false, reprogramada: null, estado: "programada", cancelacion: null, asistencia: null },
        ],
      });
      showToast("Clase agendada");
    }
  };

  const deleteClase = (id) => {
    save({ ...data, clases: data.clases.filter((c) => c.id !== id) });
  };

  const toggleCobrado = (id) => {
    save({
      ...data,
      clases: data.clases.map((c) => (c.id === id ? { ...c, cobrado: !c.cobrado } : c)),
    });
  };

  const reprogramarClase = (id, nuevaFecha, nuevaHora, motivo) => {
    save({
      ...data,
      clases: data.clases.map((c) =>
        c.id === id
          ? { ...c, fecha: nuevaFecha, hora: nuevaHora, reprogramada: { motivo, fecha_anterior: c.fecha, hora_anterior: c.hora } }
          : c
      ),
    });
    setReprogramando(null);
    showToast("Clase reprogramada");
  };

  const cancelarClase = (id, motivo, conAviso) => {
    save({
      ...data,
      clases: data.clases.map((c) =>
        c.id === id ? { ...c, estado: "cancelada", cancelacion: { motivo, conAviso } } : c
      ),
    });
    setCancelando(null);
    showToast("Clase cancelada");
  };

  const reactivarClase = (id) => {
    save({
      ...data,
      clases: data.clases.map((c) => (c.id === id ? { ...c, estado: "programada", cancelacion: null } : c)),
    });
  };

  const marcarAsistencia = (id, valor) => {
    save({
      ...data,
      clases: data.clases.map((c) => (c.id === id ? { ...c, asistencia: c.asistencia === valor ? null : valor } : c)),
    });
  };

  const editarClubDeClase = (id, clubId) => {
    save({ ...data, clases: data.clases.map((c) => (c.id === id ? { ...c, clubId } : c)) });
    setEditandoClub(null);
    showToast("Club actualizado");
  };

  return (
    <div className="app-shell" style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif", color: COLORS.ink, paddingBottom: 90 }}>
      <Header onOpenAccount={onOpenAccount} />

      {tab === "agenda" && (
        <AgendaView
          data={data}
          weekStart={weekStart}
          setWeekStart={setWeekStart}
          onAddClick={() => setShowAddClase(true)}
          onToggleCobrado={toggleCobrado}
          onDelete={deleteClase}
          onReprogramar={(clase) => setReprogramando(clase)}
          onCancelar={(clase) => setCancelando(clase)}
          onReactivar={reactivarClase}
          onMarcarAsistencia={marcarAsistencia}
          onEditarClub={(clase) => setEditandoClub(clase)}
        />
      )}
      {tab === "alumnos" && (
        <AlumnosView
          data={data}
          onAddClick={() => setShowAddAlumno(true)}
          onDelete={deleteAlumno}
          onEdit={(a) => setEditandoAlumno(a)}
          onVerClases={(a) => setVerAlumno(a)}
        />
      )}
      {tab === "clubes" && (
        <ClubesView data={data} onAddClick={() => setShowAddClub(true)} onDelete={deleteClub} onEdit={(c) => setEditandoClubInfo(c)} />
      )}
      {tab === "disponibilidad" && (
        <DisponibilidadView
          data={data}
          onToggle={toggleDisponibilidad}
          onLimpiarDia={limpiarDisponibilidadDia}
          onMarcarDiaCompleto={marcarDiaCompletoDisponible}
          onToggleExcepcion={toggleExcepcion}
          onSetExcepcionDiaCompleto={setExcepcionDiaCompleto}
          onLimpiarExcepcionesDia={limpiarExcepcionesDia}
        />
      )}
      {tab === "resumen" && <ResumenView data={data} />}

      <TabBar tab={tab} setTab={setTab} />

      {showAddClase && (
        <AddClaseModal
          alumnos={data.alumnos}
          clubes={data.clubes || []}
          clasesExistentes={data.clases}
          onClose={() => setShowAddClase(false)}
          onSave={(clase) => {
            addClase(clase);
            setShowAddClase(false);
          }}
        />
      )}
      {(showAddAlumno || editandoAlumno) && (
        <AddAlumnoModal
          clubes={data.clubes || []}
          alumno={editandoAlumno}
          onClose={() => {
            setShowAddAlumno(false);
            setEditandoAlumno(null);
          }}
          onSave={(a) => {
            if (editandoAlumno) {
              updateAlumno(editandoAlumno.id, a);
            } else {
              addAlumno(a.nombre, a.contacto, a.clubId);
            }
            setShowAddAlumno(false);
            setEditandoAlumno(null);
          }}
        />
      )}
      {(showAddClub || editandoClubInfo) && (
        <AddClubModal
          club={editandoClubInfo}
          onClose={() => {
            setShowAddClub(false);
            setEditandoClubInfo(null);
          }}
          onSave={(info) => {
            if (editandoClubInfo) {
              updateClub(editandoClubInfo.id, info);
            } else {
              addClub(info);
            }
            setShowAddClub(false);
            setEditandoClubInfo(null);
          }}
        />
      )}
      {reprogramando && (
        <ReprogramarModal clase={reprogramando} alumnos={data.alumnos} onClose={() => setReprogramando(null)} onSave={reprogramarClase} />
      )}
      {cancelando && (
        <CancelarModal clase={cancelando} alumnos={data.alumnos} onClose={() => setCancelando(null)} onSave={cancelarClase} />
      )}
      {editandoClub && (
        <EditarClubModal clase={editandoClub} clubes={data.clubes || []} onClose={() => setEditandoClub(null)} onSave={editarClubDeClase} />
      )}
      {verAlumno && (
        <AlumnoClasesModal alumno={verAlumno} clases={data.clases} clubes={data.clubes || []} onClose={() => setVerAlumno(null)} />
      )}
      {toast && <Toast msg={toast} />}
    </div>
  );
}

  return (
    <div
      style={{
        position: "fixed",
        bottom: 90,
        left: "50%",
        transform: "translateX(-50%)",
        background: COLORS.ink,
        color: "#fff",
        padding: "10px 18px",
        borderRadius: 30,
        fontSize: 14,
        fontWeight: 600,
        boxShadow: "0 8px 24px rgba(0,0,0,0.25)",
        zIndex: 100,
      }}
    >
      {msg}
    </div>
  );
}

function TabBar({ tab, setTab }) {
  const items = [
    { id: "agenda", label: "Agenda", icon: Calendar },
    { id: "alumnos", label: "Alumnos", icon: Users },
    { id: "clubes", label: "Clubes", icon: Building2 },
    { id: "disponibilidad", label: "Horarios", icon: Clock },
    { id: "resumen", label: "Resumen", icon: TrendingUp },
  ];
  return (
    <div
      className="fixed-bar"
      style={{
        position: "fixed",
        bottom: 0,
        left: 0,
        right: 0,
        background: COLORS.card,
        borderTop: `1px solid ${COLORS.line}`,
        display: "flex",
        padding: "8px 0 max(8px, env(safe-area-inset-bottom))",
        zIndex: 50,
      }}
    >
      {items.map(({ id, label, icon: Icon }) => (
        <button
          key={id}
          onClick={() => setTab(id)}
          style={{
            flex: 1,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            gap: 3,
            background: "none",
            border: "none",
            padding: "6px 0",

          <Icon size={20} strokeWidth={tab === id ? 2.5 : 2} />

      ))}

  );
}

function AgendaView({ data, weekStart, setWeekStart, onAddClick, onToggleCobrado, onDelete, onReprogramar, onCancelar, onReactivar, onMarcarAsistencia, onEditarClub }) {
  const [filtroClub, setFiltroClub] = useState("todos");
  const clubes = data.clubes || [];
  const clubById = Object.fromEntries(clubes.map((c) => [c.id, c]));
  const alumnoByNombre = Object.fromEntries((data.alumnos || []).map((a) => [a.nombre, a]));

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });

  const clasesByDay = days.map((d) => {
    const key = d.toISOString().slice(0, 10);
    return data.clases
      .filter((c) => c.fecha === key)
      .filter((c) => filtroClub === "todos" || (filtroClub === "particular" ? !c.clubId : c.clubId === filtroClub))
      .sort((a, b) => a.hora.localeCompare(b.hora));
  });

  const now = new Date();
  const in24h = new Date(now.getTime() + 24 * 3600 * 1000);

  return (
    <div style={{ padding: "16px 16px 0" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button
          onClick={() => {
            const d = new Date(weekStart);
            d.setDate(d.getDate() - 7);
            setWeekStart(d);
          }}
          style={navBtnStyle}
        >
          <ChevronLeft size={18} />
        </button>
        <div style={{ fontWeight: 700, fontSize: 14 }}>
          {fmtDateShort(days[0])} – {fmtDateShort(days[6])}
        </div>
        <button
          onClick={() => {
            const d = new Date(weekStart);
            d.setDate(d.getDate() + 7);
            setWeekStart(d);
          }}
          style={navBtnStyle}
        >
          <ChevronRight size={18} />
        </button>
      </div>

      {clubes.length > 0 && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
          <button
            onClick={() => setFiltroClub("todos")}
            style={{
              ...chipStyle,
              background: filtroClub === "todos" ? COLORS.ink : "#fff",
              color: filtroClub === "todos" ? "#fff" : COLORS.ink,
              borderColor: filtroClub === "todos" ? COLORS.ink : COLORS.line,
            }}
          >
            Todos
          </button>
          <button
            onClick={() => setFiltroClub("particular")}
            style={{
              ...chipStyle,
              background: filtroClub === "particular" ? COLORS.ink : "#fff",
              color: filtroClub === "particular" ? "#fff" : COLORS.ink,
              borderColor: filtroClub === "particular" ? COLORS.ink : COLORS.line,
            }}
          >
            Particular
          </button>
          {clubes.map((cl) => (
            <button
              key={cl.id}
              onClick={() => setFiltroClub(cl.id)}
              style={{
                ...chipStyle,
                background: filtroClub === cl.id ? cl.color : "#fff",
                color: filtroClub === cl.id ? "#fff" : COLORS.ink,
                borderColor: filtroClub === cl.id ? cl.color : COLORS.line,
              }}
            >
              {cl.nombre}
            </button>
          ))}
        </div>
      )}

      <div className="week-grid">
        {days.map((d, i) => {
        const key = d.toISOString().slice(0, 10);
        const clases = clasesByDay[i];
        const isToday = key === new Date().toISOString().slice(0, 10);
        return (
          <div key={key} style={{ marginBottom: 18 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
              <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, color: isToday ? COLORS.clay : COLORS.inkSoft }}>
                {DIAS_CORTO[d.getDay()]}
              </span>
              <span style={{ fontSize: 12, color: COLORS.inkSoft }}>{fmtDateShort(d)}</span>
              {isToday && (
                <span style={{ fontSize: 10, background: COLORS.clay, color: "#fff", padding: "1px 7px", borderRadius: 10, fontWeight: 700 }}>
                  HOY
                </span>
              )}
            </div>
            {clases.length === 0 ? (
              <div style={{ fontSize: 13, color: COLORS.inkSoft, paddingLeft: 2 }}>Sin clases</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {clases.map((c) => {
                  const claseDate = new Date(c.fecha + "T" + c.hora);
                  const prontoRecordatorio = claseDate > now && claseDate <= in24h;
                  const cancelada = c.estado === "cancelada";
                  const finClase = new Date(c.fecha + "T" + addMinutos(c.hora, c.duracionMin || 60));
                  const yaPaso = finClase < now;
                  return (
                    <div key={c.id} style={{ ...cardStyle, opacity: cancelada ? 0.6 : 1 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", gap: 6 }}>
                            <Clock size={14} color={COLORS.court} />
                            <span style={{ textDecoration: cancelada ? "line-through" : "none" }}>
                              {c.hora} - {addMinutos(c.hora, c.duracionMin || 60)}
                            </span>
                            {prontoRecordatorio && !cancelada && (
                              <span title="Recordatorio 24hs" style={{ display: "inline-flex" }}>
                                <Bell size={13} color={COLORS.clay} />
                              </span>
                            )}
                          </div>
                          <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginTop: 2, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                            {!cancelada && (
                              <button
                                onClick={() => onEditarClub(c)}
                                style={{
                                  fontSize: 10.5,
                                  fontWeight: 700,
                                  color: c.clubId && clubById[c.clubId] ? "#fff" : COLORS.inkSoft,
                                  background: c.clubId && clubById[c.clubId] ? clubById[c.clubId].color : "transparent",
                                  border: c.clubId && clubById[c.clubId] ? "none" : `1px dashed ${COLORS.line}`,
                                  padding: "1px 7px",
                                  borderRadius: 8,
                                  cursor: "pointer",
                                }}
                              >
                                {c.clubId && clubById[c.clubId] ? clubById[c.clubId].nombre : "Sin club ✎"}
                              </button>
                            )}
                            {c.alumnosNombres.join(", ")}
                          </div>
                          {c.reprogramada && (

                              <CloudRain size={12} /> Reprogramada{c.reprogramada.motivo ? ` · ${c.reprogramada.motivo}` : ""}
                            </div>
                          )}
                          {cancelada && (
                            <div style={{ fontSize: 11.5, color: "#B23A3A", marginTop: 4, fontWeight: 700 }}>
                              Cancelada{c.cancelacion?.motivo ? ` · ${c.cancelacion.motivo}` : ""}

                            </div>
                          )}
                          {!cancelada && c.asistencia && (
                            <div
                              style={{
                                fontSize: 11.5,
                                marginTop: 4,
                                fontWeight: 700,
                                color:
                                  c.asistencia === "asistio" ? COLORS.court : c.asistencia === "falto_aviso" ? COLORS.clay : "#B23A3A",
                              }}

                              {c.asistencia === "asistio" ? "Asistió" : c.asistencia === "falto_aviso" ? "Faltó con aviso" : "Faltó sin aviso"}
                            </div>
                          )}
                        </div>
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontWeight: 700, fontSize: 14 }}>{fmtMoney(c.precio)}</div>
                          <div style={{ fontSize: 11, color: COLORS.inkSoft }}>
                            vos: {fmtMoney(calcularGanancia(c))}
                          </div>
                        </div>
                      </div>

                      {cancelada ? (
                        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                          <button onClick={() => onReactivar(c.id)} style={{ ...pillBtn, background: "transparent", color: COLORS.court, border: `1px solid ${COLORS.court}` }}>
                            Reactivar
                          </button>
                          <button
                            onClick={() => onDelete(c.id)}
                            style={{ ...pillBtn, background: "transparent", color: COLORS.inkSoft, border: `1px solid ${COLORS.line}`, marginLeft: "auto" }}
                          >
                            <Trash2 size={12} />
                          </button>
                        </div>
                      ) : (
                        <>
                          {(() => {
                            const alumnosConTel = c.alumnosNombres
                              .map((n) => alumnoByNombre[n])
                              .filter((a) => a && a.contacto);
                            if (alumnosConTel.length === 0) return null;
                            const mensaje = `Hola! Te confirmo tu clase${c.clubId && clubById[c.clubId] ? ` en ${clubById[c.clubId].nombre}` : ""} el ${fmtFechaHoraLarga(c.fecha, c.hora)}. Cualquier cosa avisame 🎾`;
                            return (
                              <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
                                {alumnosConTel.map((a) => (
                                  <a
                                    key={a.id}
                                    href={linkWhatsApp(a.contacto, mensaje)}
                                    target="_blank"
                                    rel="noreferrer"
                                    style={{ ...pillBtn, background: "#25D366", color: "#fff", border: "none", textDecoration: "none" }}
                                  >
                                    <MessageCircle size={12} /> Avisar a {a.nombre.split(" ")[0]}
                                  </a>
                                ))}
                              </div>
                            );
                          })()}
                          <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                            <button
                              onClick={() => onToggleCobrado(c.id)}
                              style={{
                                ...pillBtn,
                                background: c.cobrado ? COLORS.court : "transparent",
                                color: c.cobrado ? "#fff" : COLORS.court,
                                border: `1px solid ${COLORS.court}`,
                              }}
                            >
                              <Check size={12} /> {c.cobrado ? "Cobrado" : "Pendiente"}
                            </button>
                            <button onClick={() => onReprogramar(c)} style={{ ...pillBtn, background: "transparent", color: COLORS.clay, border: `1px solid ${COLORS.clay}` }}>
                              <CloudRain size={12} /> Reprogramar
                            </button>
                            <button onClick={() => onCancelar(c)} style={{ ...pillBtn, background: "transparent", color: "#B23A3A", border: "1px solid #B23A3A" }}>
                              Cancelar

                            <button
                              onClick={() => onDelete(c.id)}
                              style={{ ...pillBtn, background: "transparent", color: COLORS.inkSoft, border: `1px solid ${COLORS.line}`, marginLeft: "auto" }}
                            >
                              <Trash2 size={12} />
                            </button>
                          </div>
                          {yaPaso && (
                            <div style={{ display: "flex", gap: 6, marginTop: 8, paddingTop: 8, borderTop: `1px dashed ${COLORS.line}` }}>
                              <span style={{ fontSize: 11, color: COLORS.inkSoft, alignSelf: "center", marginRight: 2 }}>Asistencia:</span>
                              <button
                                onClick={() => onMarcarAsistencia(c.id, "asistio")}
                                style={{
                                  ...miniPillBtn,
                                  background: c.asistencia === "asistio" ? COLORS.court : "transparent",
                                  color: c.asistencia === "asistio" ? "#fff" : COLORS.court,
                                  border: `1px solid ${COLORS.court}`,
                                }}
                              >
                                Asistió
                              </button>
                              <button
                                onClick={() => onMarcarAsistencia(c.id, "falto_aviso")}
                                style={{
                                  ...miniPillBtn,
                                  background: c.asistencia === "falto_aviso" ? COLORS.clay : "transparent",
                                  color: c.asistencia === "falto_aviso" ? "#fff" : COLORS.clay,
                                  border: `1px solid ${COLORS.clay}`,
                                }}
                              >
                                Faltó (avisó)
                              </button>
                              <button
                                onClick={() => onMarcarAsistencia(c.id, "falto_sin_aviso")}
                                style={{
                                  ...miniPillBtn,
                                  background: c.asistencia === "falto_sin_aviso" ? "#B23A3A" : "transparent",
                                  color: c.asistencia === "falto_sin_aviso" ? "#fff" : "#B23A3A",
                                  border: "1px solid #B23A3A",
                                }}
                              >
                                Sin aviso
                              </button>
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
      </div>

      <button onClick={onAddClick} style={fabStyle}>
        <Plus size={24} color="#fff" />
      </button>
    </div>
  );
}

function primerDiaMes(d) {
  return toISODateLocal(new Date(d.getFullYear(), d.getMonth(), 1));
}
function ultimoDiaMes(d) {
  return toISODateLocal(new Date(d.getFullYear(), d.getMonth() + 1, 0));
}

const HORAS_DISPONIBILIDAD = Array.from({ length: 15 }, (_, i) => i + 8); // 8:00 a 22:00

function DisponibilidadView({ data, onToggle, onLimpiarDia, onMarcarDiaCompleto, onToggleExcepcion, onSetExcepcionDiaCompleto, onLimpiarExcepcionesDia }) {
  const [subVista, setSubVista] = useState("patron"); // patron | excepciones
  const [mesRef, setMesRef] = useState(() => new Date());
  const [semanaIdx, setSemanaIdx] = useState(0);

  const disponibilidad = data.disponibilidad || [];
  const excepciones = data.disponibilidadExcepciones || {};
  const clubById = Object.fromEntries((data.clubes || []).map((c) => [c.id, c]));

  const estaDisponiblePatron = (dia, hora) => disponibilidad.includes(`${dia}-${hora}`);
  const diaCompletoPatron = (dia) => HORAS_DISPONIBILIDAD.every((h) => estaDisponiblePatron(dia, h));

  const anio = mesRef.getFullYear();
  const mes = mesRef.getMonth();
  const nombreMes = mesRef.toLocaleDateString("es-AR", { month: "long", year: "numeric" });

  // Semanas (domingo a sábado) que tocan este mes
  const semanas = [];
  {
    let cursor = startOfWeek(new Date(anio, mes, 1));
    const finMes = new Date(anio, mes + 1, 0);
    while (cursor <= finMes) {
      semanas.push(new Date(cursor));
      cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 7);
    }
  }
  const semanaBase = semanas[Math.min(semanaIdx, semanas.length - 1)] || startOfWeek(new Date(anio, mes, 1));
  const diasSemana = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(semanaBase);
    d.setDate(d.getDate() + i);
    return d;
  });

  const efectivoEnFecha = (fechaStr, diaSemana, hora) => {
    const key = `${fechaStr}-${hora}`;
    const exc = excepciones[key];
    if (exc === "on") return true;
    if (exc === "off") return false;
    return estaDisponiblePatron(diaSemana, hora);
  };
  const esExcepcion = (fechaStr, hora) => excepciones[`${fechaStr}-${hora}`] != null;

  // Ocupación real por fecha exacta
  const ocupadoInfo = {}; // key fecha-hora -> {clubId}
  (data.clases || [])
    .filter((c) => c.estado !== "cancelada")
    .forEach((c) => {
      const [hh, mm] = c.hora.split(":").map(Number);
      const inicioDec = hh + mm / 60;
      const finDec = inicioDec + (c.duracionMin || 60) / 60;
      HORAS_DISPONIBILIDAD.forEach((h) => {
        if (inicioDec < h + 1 && finDec > h) {
          ocupadoInfo[`${c.fecha}-${h}`] = { clubId: c.clubId };
        }
      });
    });

  const diaCompletoExcepcion = (fechaStr, diaSemana) => HORAS_DISPONIBILIDAD.every((h) => efectivoEnFecha(fechaStr, diaSemana, h));

  const modeBtn = (activo) => ({
    flex: 1,
    padding: "9px 0",
    borderRadius: 10,
    border: "none",
    fontSize: 13,
    fontWeight: 700,
    cursor: "pointer",
    background: activo ? COLORS.court : "#fff",
    color: activo ? "#fff" : COLORS.ink,
    boxShadow: activo ? "none" : `inset 0 0 0 1px ${COLORS.line}`,
  });

  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 4 }}>Mis horarios disponibles</div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <button style={modeBtn(subVista === "patron")} onClick={() => setSubVista("patron")}>
          Patrón general
        </button>
        <button style={modeBtn(subVista === "excepciones")} onClick={() => setSubVista("excepciones")}>
          Excepciones por fecha
        </button>
      </div>

      {subVista === "patron" ? (
        <>
          <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 14 }}>
            Esta es tu regla general: se repite todas las semanas. Tocá los bloques en los que podés dar clase habitualmente. Tocá el día para marcarlo completo o vaciarlo de una.
          </div>
          <div style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: "44px repeat(7, 1fr)", gap: 3, minWidth: 460 }}>
              <div />
              {DIAS_CORTO.map((d, dia) => (
                <button
                  key={dia}
                  onClick={() => (diaCompletoPatron(dia) ? onLimpiarDia(dia) : onMarcarDiaCompleto(dia, HORAS_DISPONIBILIDAD))}
                  style={{
                    border: "none",
                    borderRadius: 6,
                    padding: "6px 2px",
                    fontSize: 10.5,
                    fontWeight: 800,
                    cursor: "pointer",
                    background: diaCompletoPatron(dia) ? COLORS.court : COLORS.line,
                    color: diaCompletoPatron(dia) ? "#fff" : COLORS.ink,
                  }}
                >
                  {d}
                </button>
              ))}
              {HORAS_DISPONIBILIDAD.map((hora) => (
                <React.Fragment key={hora}>
                  <div style={{ fontSize: 10.5, color: COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 4 }}>
                    {String(hora).padStart(2, "0")}
                  </div>
                  {DIAS_CORTO.map((_, dia) => {
                    const activo = estaDisponiblePatron(dia, hora);
                    return (
                      <button
                        key={dia}
                        onClick={() => onToggle(dia, hora)}
                        style={{
                          height: 26,
                          border: "none",
                          borderRadius: 4,
                          cursor: "pointer",
                          background: activo ? COLORS.court : "#fff",
                          boxShadow: activo ? "none" : `inset 0 0 0 1px ${COLORS.line}`,
                        }}
                      />
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>
        </>
      ) : (
        <>
          <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 12 }}>
            Acá corregís casos puntuales sin tocar tu regla general (ej: "los lunes suelo estar libre, pero este lunes 10 no").
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
            <button
              onClick={() => { setMesRef(new Date(anio, mes - 1, 1)); setSemanaIdx(0); }}
              style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: 6, cursor: "pointer" }}
            >
              <ChevronLeft size={16} />
            </button>
            <div style={{ fontWeight: 700, fontSize: 14, textTransform: "capitalize" }}>{nombreMes}</div>
            <button
              onClick={() => { setMesRef(new Date(anio, mes + 1, 1)); setSemanaIdx(0); }}
              style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: 6, cursor: "pointer" }}
            >
              <ChevronRight size={16} />
            </button>
          </div>

          <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
            {semanas.map((s, i) => {
              const fin = new Date(s);
              fin.setDate(fin.getDate() + 6);
              return (
                <button
                  key={i}
                  onClick={() => setSemanaIdx(i)}
                  style={{
                    ...chipStyle,
                    background: i === semanaIdx ? COLORS.court : "#fff",
                    color: i === semanaIdx ? "#fff" : COLORS.ink,
                    borderColor: i === semanaIdx ? COLORS.court : COLORS.line,
                  }}
                >
                  {fmtDateShort(s)}–{fmtDateShort(fin)}
                </button>
              );
            })}
          </div>

          <div style={{ display: "flex", gap: 14, marginBottom: 14, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: COLORS.court }} /> Libre
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: "#E8B93E" }} /> Con clase agendada
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, boxShadow: `inset 0 0 0 2px ${COLORS.clay}` }} /> Excepción puntual
            </div>
          </div>

          <div style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: "44px repeat(7, 1fr)", gap: 3, minWidth: 460 }}>
              <div />
              {diasSemana.map((d, i) => {
                const fechaStr = toISODateLocal(d);
                const esHoy = fechaStr === toISODateLocal(new Date());
                return (
                  <button
                    key={fechaStr}
                    onClick={() => onSetExcepcionDiaCompleto(fechaStr, d.getDay(), HORAS_DISPONIBILIDAD, !diaCompletoExcepcion(fechaStr, d.getDay()))}
                    style={{
                      border: esHoy ? `1.5px solid ${COLORS.clay}` : "none",
                      borderRadius: 6,
                      padding: "4px 2px",
                      fontSize: 10,
                      fontWeight: 800,
                      cursor: "pointer",
                      background: diaCompletoExcepcion(fechaStr, d.getDay()) ? COLORS.court : COLORS.line,
                      color: diaCompletoExcepcion(fechaStr, d.getDay()) ? "#fff" : COLORS.ink,
                      lineHeight: 1.3,
                    }}
                  >
                    {DIAS_CORTO[d.getDay()]}
                    <br />
                    {d.getDate()}
                  </button>
                );
              })}

              {HORAS_DISPONIBILIDAD.map((hora) => (
                <React.Fragment key={hora}>
                  <div style={{ fontSize: 10.5, color: COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 4 }}>
                    {String(hora).padStart(2, "0")}
                  </div>
                  {diasSemana.map((d) => {
                    const fechaStr = toISODateLocal(d);
                    const diaSemana = d.getDay();
                    const activo = efectivoEnFecha(fechaStr, diaSemana, hora);
                    const ocupInfo = ocupadoInfo[`${fechaStr}-${hora}`];
                    const esExc = esExcepcion(fechaStr, hora);
                    let bg = "#fff";
                    let sombra = `inset 0 0 0 1px ${COLORS.line}`;
                    if (ocupInfo) {
                      bg = "#E8B93E";
                      sombra = "none";
                    } else if (activo) {
                      bg = COLORS.court;
                      sombra = "none";
                    }
                    if (esExc) sombra = `inset 0 0 0 2px ${COLORS.clay}`;
                    return (
                      <button
                        key={fechaStr}
                        onClick={() => onToggleExcepcion(fechaStr, diaSemana, hora)}
                        title={ocupInfo ? `Clase agendada · ${fechaStr}` : esExc ? "Excepción puntual" : undefined}
                        style={{ height: 26, border: "none", borderRadius: 4, cursor: "pointer", background: bg, boxShadow: sombra }}
                      />
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>

          <button
            onClick={() => diasSemana.forEach((d) => onLimpiarExcepcionesDia(toISODateLocal(d)))}
            style={{ marginTop: 12, background: "none", border: "none", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: 0 }}
          >
            Borrar excepciones de esta semana (volver al patrón general)
          </button>
        </>
      )}

      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 18 }}>
        Esta disponibilidad es la base para cuando un club pueda asignarte clases directamente en los horarios que marques libres, sin tener que consultarte antes.
      </div>
    </div>
  );
}

function ResumenView({ data }) {
  const now = new Date();
  const clubes = data.clubes || [];
  const clubById = Object.fromEntries(clubes.map((c) => [c.id, c]));

  const [desde, setDesde] = useState(primerDiaMes(now));
  const [hasta, setHasta] = useState(ultimoDiaMes(now));
  const [clubFiltro, setClubFiltro] = useState("todos");

  const clasesDelRango = data.clases.filter((c) => c.fecha >= desde && c.fecha <= hasta);
  const clasesFiltradas = clasesDelRango.filter(
    (c) => clubFiltro === "todos" || (clubFiltro === "particular" ? !c.clubId : c.clubId === clubFiltro)
  );

  const clasesActivas = clasesFiltradas.filter((c) => c.estado !== "cancelada");
  const canceladas = clasesFiltradas.filter((c) => c.estado === "cancelada");
  const ausenciasSinAviso = clasesFiltradas.filter((c) => c.asistencia === "falto_sin_aviso").length;

  const totalFacturado = clasesActivas.reduce((s, c) => s + Number(c.precio || 0), 0);
  const totalCobrado = clasesActivas.filter((c) => c.cobrado).reduce((s, c) => s + Number(c.precio || 0), 0);
  const totalPendiente = totalFacturado - totalCobrado;
  const gananciaNeta = clasesActivas.reduce((s, c) => s + calcularGanancia(c), 0);

  // El detalle final por club siempre muestra todos los clubes del rango, sin importar el filtro elegido arriba
  const clasesActivasRango = clasesDelRango.filter((c) => c.estado !== "cancelada");
  const porClub = {};
  clasesActivasRango.forEach((c) => {
    const key = c.clubId || "particular";
    if (!porClub[key]) porClub[key] = { ganancia: 0, facturado: 0, cantidad: 0 };
    porClub[key].ganancia += calcularGanancia(c);
    porClub[key].facturado += Number(c.precio || 0);
    porClub[key].cantidad += 1;
  });

  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 12 }}>Resumen</div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <div style={{ flex: 1 }}>
          <Label>Desde</Label>
          <input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} style={inputStyle} />
        </div>
        <div style={{ flex: 1 }}>
          <Label>Hasta</Label>
          <input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} style={inputStyle} />
        </div>
      </div>

      {clubes.length > 0 && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
          <button
            onClick={() => setClubFiltro("todos")}
            style={{ ...chipStyle, background: clubFiltro === "todos" ? COLORS.ink : "#fff", color: clubFiltro === "todos" ? "#fff" : COLORS.ink, borderColor: clubFiltro === "todos" ? COLORS.ink : COLORS.line }}
          >
            Todos
          </button>
          <button
            onClick={() => setClubFiltro("particular")}
            style={{ ...chipStyle, background: clubFiltro === "particular" ? COLORS.ink : "#fff", color: clubFiltro === "particular" ? "#fff" : COLORS.ink, borderColor: clubFiltro === "particular" ? COLORS.ink : COLORS.line }}
          >
            Particular
          </button>
          {clubes.map((cl) => (
            <button
              key={cl.id}
              onClick={() => setClubFiltro(cl.id)}
              style={{ ...chipStyle, background: clubFiltro === cl.id ? cl.color : "#fff", color: clubFiltro === cl.id ? "#fff" : COLORS.ink, borderColor: clubFiltro === cl.id ? cl.color : COLORS.line }}
            >
              {cl.nombre}
            </button>
          ))}
        </div>
      )}

      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>
        {clasesActivas.length} clases
        {canceladas.length > 0 ? ` · ${canceladas.length} canceladas` : ""}
        {ausenciasSinAviso > 0 ? ` · ${ausenciasSinAviso} ausencias sin aviso` : ""}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <StatCard label="Facturado" value={fmtMoney(totalFacturado)} color={COLORS.ink} />
        <StatCard label="Tu ganancia" value={fmtMoney(gananciaNeta)} color={COLORS.court} big />
        <StatCard label="Cobrado" value={fmtMoney(totalCobrado)} color={COLORS.court} />
        <StatCard label="Pendiente" value={fmtMoney(totalPendiente)} color={COLORS.clay} />
      </div>

      {clasesFiltradas.length === 0 && (
        <div style={{ color: COLORS.inkSoft, fontSize: 14, marginTop: 20 }}>
          No hay clases cargadas en ese rango{clubFiltro !== "todos" ? " para ese club" : ""}.
        </div>
      )}

      {Object.keys(porClub).length > 0 && (
        <div style={{ marginTop: 22 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 2 }}>Detalle por club</div>
          <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 8 }}>Facturado trabajado en el período, sin importar el filtro de arriba</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {Object.entries(porClub).map(([key, info]) => (
              <div key={key} style={{ ...cardStyle, padding: "10px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: key === "particular" ? COLORS.inkSoft : clubById[key]?.color }} />
                    <span style={{ fontSize: 13.5, fontWeight: 600 }}>{key === "particular" ? "Particular" : clubById[key]?.nombre || "Club eliminado"}</span>
                    <span style={{ fontSize: 11.5, color: COLORS.inkSoft }}>· {info.cantidad} clases</span>
                  </div>
                  <span style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.court }}>{fmtMoney(info.ganancia)}</span>
                </div>
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 3, marginLeft: 16 }}>
                  Facturado total: {fmtMoney(info.facturado)}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

      <div style={{ fontSize: big ? 30 : 22, fontWeight: 800, color, marginTop: 4 }}>{value}</div>

function AddClaseModal({ alumnos, clubes, clasesExistentes, onClose, onSave }) {
  const [seleccion, setSeleccion] = useState([]);
  const [fecha, setFecha] = useState(new Date().toISOString().slice(0, 10));
  const [hora, setHora] = useState("09:00");
  const [duracionMin, setDuracionMin] = useState(60);
  const [precio, setPrecio] = useState("");
  const [porcentaje, setPorcentaje] = useState("100");
  const [montoFijo, setMontoFijo] = useState("");
  const [modoAbono, setModoAbono] = useState(false);
  const [clubId, setClubId] = useState(null);
  const [busquedaAlumno, setBusquedaAlumno] = useState("");
  const [nuevoContacto, setNuevoContacto] = useState("");
  const [mostrarLista, setMostrarLista] = useState(false);

  const aplicarClub = (id) => {
    setClubId(id);
    const club = (clubes || []).find((cl) => cl.id === id);
    if (club && club.gananciaTipo === "monto") {
      setMontoFijo(String(club.gananciaValor ?? ""));
      setPorcentaje("100");
    } else if (club) {
      setPorcentaje(String(club.gananciaValor ?? 100));
      setMontoFijo("");
    } else {
      setMontoFijo("");
    }
  };

  const horaFin = addMinutos(hora, duracionMin);

  const fechasAbono = modoAbono ? fechasDelMesPorDiaSemana(fecha) : [fecha];
  const totalAbono = fechasAbono.length * Number(precio || 0);

  const conflictosAbono = modoAbono
    ? fechasAbono.filter((f) =>
        (clasesExistentes || []).some((c) => {
          if (c.estado === "cancelada" || c.fecha !== f) return false;
          const finExistente = addMinutos(c.hora, c.duracionMin || 60);
          return rangosSuperponen(hora, horaFin, c.hora, finExistente);
        })
      )
    : [];

  const superpuesta = (clasesExistentes || []).find((c) => {
    if (c.estado === "cancelada" || c.fecha !== fecha) return false;
    const finExistente = addMinutos(c.hora, c.duracionMin || 60);
    return rangosSuperponen(hora, horaFin, c.hora, finExistente);
  });

  const toggleAlumno = (a) => {
    setSeleccion((prev) => {
      const exists = prev.find((x) => x.id === a.id);
      if (exists) return prev.filter((x) => x.id !== a.id);
      if (prev.length >= 4) return prev;
      if (prev.length === 0 && clubId === null && a.clubId) {
        aplicarClub(a.clubId);
      }
      return [...prev, a];
    });
  };

  const addNuevoAdHoc = () => {
    if (!busquedaAlumno.trim() || seleccion.length >= 4) return;
    setSeleccion((prev) => [...prev, { id: uid(), nombre: busquedaAlumno.trim(), contacto: nuevoContacto.trim(), adhoc: true }]);
    setBusquedaAlumno("");
    setNuevoContacto("");
    setMostrarLista(false);
  };

  const alumnosFiltrados =
    busquedaAlumno.trim().length === 0
      ? []
      : alumnos.filter(
          (a) => a.nombre.toLowerCase().includes(busquedaAlumno.trim().toLowerCase()) && !seleccion.find((s) => s.id === a.id)
        );

  const yaExisteExacto = alumnos.some((a) => a.nombre.toLowerCase() === busquedaAlumno.trim().toLowerCase());

  const puedeGuardar = seleccion.length > 0 && fecha && hora && precio;

  return (
    <ModalShell title="Nueva clase" onClose={onClose}>
      {clubes && clubes.length > 0 && (
        <>
          <Label>Club / lugar</Label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
            <button
              onClick={() => aplicarClub(null)}
              style={{
                ...chipStyle,
                background: clubId === null ? COLORS.ink : "#fff",
                color: clubId === null ? "#fff" : COLORS.ink,
                borderColor: clubId === null ? COLORS.ink : COLORS.line,
              }}
            >
              Particular
            </button>
            {clubes.map((cl) => (
              <button
                key={cl.id}
                onClick={() => aplicarClub(cl.id)}
                style={{
                  ...chipStyle,
                  background: clubId === cl.id ? cl.color : "#fff",
                  color: clubId === cl.id ? "#fff" : COLORS.ink,
                  borderColor: clubId === cl.id ? cl.color : COLORS.line,
                }}
              >
                {cl.nombre}
              </button>
            ))}
          </div>
        </>
      )}

      <Label>Alumnos (hasta 4)</Label>

      {seleccion.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
          {seleccion.map((s) => (
            <button
              key={s.id}
              onClick={() => toggleAlumno(s)}
              style={{ ...chipStyle, background: COLORS.court, color: "#fff", borderColor: COLORS.court, display: "flex", alignItems: "center", gap: 5 }}
            >
              {s.nombre} <span style={{ fontWeight: 900 }}>✕</span>
            </button>
          ))}
        </div>
      )}

      {seleccion.length < 4 && (
        <div style={{ position: "relative", marginBottom: 6 }}>
          <input
            value={busquedaAlumno}
            onChange={(e) => {
              setBusquedaAlumno(e.target.value);
              setMostrarLista(true);
            }}
            onFocus={() => setMostrarLista(true)}
            placeholder="🔍 Buscar alumno por nombre..."
            style={inputStyle}
          />
          {mostrarLista && busquedaAlumno.trim().length > 0 && (
            <div
              style={{
                position: "absolute",
                top: "100%",
                left: 0,
                right: 0,
                background: "#fff",
                border: `1px solid ${COLORS.line}`,
                borderRadius: 10,
                marginTop: 4,
                maxHeight: 220,
                overflowY: "auto",
                zIndex: 10,
                boxShadow: "0 8px 20px rgba(0,0,0,0.12)",
              }}
            >
              {alumnosFiltrados.map((a) => (
                <button
                  key={a.id}
                  onClick={() => {
                    toggleAlumno(a);
                    setBusquedaAlumno("");
                    setMostrarLista(false);
                  }}
                  style={{
                    display: "block",
                    width: "100%",
                    textAlign: "left",
                    padding: "10px 12px",
                    border: "none",
                    background: "none",
                    borderBottom: `1px solid ${COLORS.line}`,
                    cursor: "pointer",
                    fontSize: 14,
                  }}
                >
                  {a.nombre}
                </button>
              ))}
              {!yaExisteExacto && (
                <div style={{ padding: 12 }}>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 6 }}>
                    No encontrado. Cargar "{busquedaAlumno.trim()}" como alumno nuevo:
                  </div>
                  <input
                    value={nuevoContacto}
                    onChange={(e) => setNuevoContacto(e.target.value)}
                    placeholder="Teléfono (opcional)"
                    style={{ ...inputStyle, marginBottom: 8, fontSize: 13, padding: "8px 10px" }}
                  />
                  <button onClick={addNuevoAdHoc} style={{ ...pillBtn, background: COLORS.court, color: "#fff", border: "none", width: "100%", justifyContent: "center" }}>
                    + Agregar como alumno nuevo
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      )}
      {seleccion.length > 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 14 }}>
          Clase de {seleccion.length} alumno{seleccion.length > 1 ? "s" : ""}: {seleccion.map((s) => s.nombre).join(", ")}
        </div>
      )}

      <Label>Fecha {modoAbono ? "de la primera clase" : ""}</Label>
      <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />

      <div
        onClick={() => setModoAbono((v) => !v)}
        style={{
          display: "flex",
          alignItems: "center",
          gap: 10,
          padding: "10px 12px",
          borderRadius: 10,
          border: `1px solid ${modoAbono ? COLORS.court : COLORS.line}`,
          background: modoAbono ? "#EAF2EF" : "#fff",
          marginBottom: 14,
          cursor: "pointer",
        }}
      >
        <div
          style={{
            width: 18,
            height: 18,
            borderRadius: 5,
            border: `2px solid ${modoAbono ? COLORS.court : COLORS.inkSoft}`,
            background: modoAbono ? COLORS.court : "transparent",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            flexShrink: 0,
          }}
        >
          {modoAbono && <Check size={12} color="#fff" />}
        </div>
        <div>
          <div style={{ fontWeight: 700, fontSize: 13.5 }}>Abono mensual (repetir cada semana)</div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft }}>
            Reserva automáticamente el mismo día y horario todas las semanas hasta fin de mes.
          </div>
        </div>
      </div>

      <Label>Horario</Label>
      <input type="time" value={hora} onChange={(e) => setHora(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />

      <Label>Duración</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 4 }}>
        {[
          { label: "1 h", min: 60 },
          { label: "1:30 h", min: 90 },
          { label: "2 h", min: 120 },
          { label: "2:30 h", min: 150 },
        ].map((opt) => (
          <button
            key={opt.min}
            onClick={() => setDuracionMin(opt.min)}
            style={{
              ...chipStyle,
              background: duracionMin === opt.min ? COLORS.court : "#fff",
              color: duracionMin === opt.min ? "#fff" : COLORS.ink,
              borderColor: duracionMin === opt.min ? COLORS.court : COLORS.line,
            }}
          >
            {opt.label}
          </button>
        ))}
      </div>
      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 12 }}>
        Termina a las {horaFin} — se agenda de una vez, no hace falta cargarla en dos partes.
      </div>

      {superpuesta && (
        <div style={{ fontSize: 12.5, color: "#B23A3A", marginTop: -6, marginBottom: 12, fontWeight: 600 }}>
          ⚠ Se superpone con la clase de {superpuesta.alumnosNombres.join(", ")} ({superpuesta.hora} - {addMinutos(superpuesta.hora, superpuesta.duracionMin || 60)}).
        </div>
      )}

      <Label>Precio {modoAbono ? "por clase" : "total de la clase"}</Label>
      <input
        type="number"
        inputMode="numeric"
        value={precio}
        onChange={(e) => setPrecio(e.target.value)}
        placeholder="Ej: 8000"
        style={{ ...inputStyle, marginBottom: modoAbono ? 6 : 12 }}
      />

      {modoAbono && (
        <div style={{ background: COLORS.clayLight, borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink }}>
            {fechasAbono.length} clases este mes ({DIAS[new Date(fecha + "T00:00:00").getDay()]}s)
          </div>
          <div style={{ fontSize: 13, color: COLORS.ink, marginTop: 2 }}>
            Total del mes: <strong>{fmtMoney(totalAbono)}</strong>
          </div>
          {conflictosAbono.length > 0 && (
            <div style={{ fontSize: 12, color: "#B23A3A", marginTop: 6, fontWeight: 600 }}>
              ⚠ {conflictosAbono.length} de esas fechas se superponen con clases que ya tenés agendadas.
            </div>
          )}
        </div>

function AlumnoClasesModal({ alumno, clases, clubes, onClose }) {
  const clubById = Object.fromEntries(clubes.map((c) => [c.id, c]));
  const now = new Date();

  const clasesDelAlumno = clases
    .filter((c) => c.alumnosNombres.includes(alumno.nombre))
    .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

  const proximas = clasesDelAlumno.filter((c) => new Date(c.fecha + "T" + c.hora) >= now && c.estado !== "cancelada");
  const anteriores = clasesDelAlumno.filter((c) => new Date(c.fecha + "T" + c.hora) < now || c.estado === "cancelada").reverse();

  const renderClase = (c) => (
    <div key={c.id} style={{ ...cardStyle, padding: "10px 14px", opacity: c.estado === "cancelada" ? 0.6 : 1 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 14 }}>
            {fmtFechaHoraLarga(c.fecha, c.hora)}
          </div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2, display: "flex", alignItems: "center", gap: 6 }}>
            {c.clubId && clubById[c.clubId] && (
              <span style={{ fontSize: 10, fontWeight: 700, color: "#fff", background: clubById[c.clubId].color, padding: "1px 6px", borderRadius: 7 }}>
                {clubById[c.clubId].nombre}
              </span>
            )}
            {c.estado === "cancelada"
              ? "Cancelada"
              : c.asistencia === "asistio"
              ? "Asistió"
              : c.asistencia === "falto_aviso"
              ? "Faltó (avisó)"
              : c.asistencia === "falto_sin_aviso"
              ? "Faltó sin aviso"
              : c.cobrado
              ? "Cobrado"
              : "Pendiente"}
          </div>
        </div>
        <div style={{ fontWeight: 700, fontSize: 13.5 }}>{fmtMoney(c.precio)}</div>
      </div>
    </div>
  );

  return (
    <ModalShell title={alumno.nombre} onClose={onClose}>
      {alumno.contacto && <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>{alumno.contacto}</div>}

      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8 }}>Próximas clases ({proximas.length})</div>
      {proximas.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 20 }}>No tiene clases agendadas.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 20 }}>{proximas.map(renderClase)}</div>
      )}

      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8 }}>Historial ({anteriores.length})</div>
      {anteriores.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Todavía no tiene clases pasadas.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{anteriores.map(renderClase)}</div>
      )}
    </ModalShell>
  );
}
