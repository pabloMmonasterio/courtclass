async function obtenerOcrearPerfil(userId, rolPreferido) {
  const { data: filas, error } = await supabaseClient.from("usuarios").select("*").eq("id", userId);
  if (error) { console.error("Error leyendo perfil", error); return null; }
  if (filas && filas.length > 0) return filas[0];

  const rol = rolPreferido === "club" ? "club" : "profe";
  const { data: userInfo } = await supabaseClient.auth.getUser();
  const meta = (userInfo && userInfo.user && userInfo.user.user_metadata) || {};
  const nuevo = {
    id: userId,
    rol,
    nombre: meta.nombre || "",
    telefono: meta.telefono || "",
    email: (userInfo && userInfo.user && userInfo.user.email) || "",
  };
  const { data: insertado, error: errorInsert } = await supabaseClient.from("usuarios").insert(nuevo).select();
  if (errorInsert) { console.error("Error creando perfil", errorInsert); return null; }
  return insertado && insertado[0] ? insertado[0] : nuevo;
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d;
}

function fmtMoney(n) {
  return "$" + Number(n || 0).toLocaleString("es-AR");
}

function calcularGanancia(c) {
  if (c.montoFijo != null && c.montoFijo !== "") return Number(c.montoFijo);
  return (Number(c.precio || 0) * Number(c.porcentaje || 100)) / 100;
}

function fmtDateShort(d) {
  return d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function addMinutos(hora, minutos) {
  const [h, m] = hora.split(":").map(Number);
  const total = h * 60 + m + minutos;
  const hh = Math.floor(((total % 1440) + 1440) % 1440 / 60);
  const mm = ((total % 60) + 60) % 60;
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

function rangosSuperponen(inicioA, finA, inicioB, finB) {
  return inicioA < finB && inicioB < finA;
}

function linkWhatsApp(telefono, mensaje) {
  const limpio = (telefono || "").replace(/[^\d]/g, "");
  return `https://wa.me/${limpio}?text=${encodeURIComponent(mensaje)}`;
}

function fmtFechaLarga(fechaISO) {
  const d = new Date(fechaISO + "T00:00:00");
  const texto = d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function fmtFechaHoraLarga(fechaISO, hora) {
  return `${fmtFechaLarga(fechaISO)} a las ${hora}`;
}

function toISODateLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function fechasDelMesPorDiaSemana(fechaBase) {
  const [y, m, day] = fechaBase.split("-").map(Number);
  const base = new Date(y, m - 1, day);
  const weekday = base.getDay();
  const fechas = [];
  const cursor = new Date(y, m - 1, 1);
  while (cursor.getMonth() === m - 1) {
    if (cursor.getDay() === weekday && cursor >= base) {
      fechas.push(toISODateLocal(cursor));
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return fechas;
}

          onSave={(clase) => {
            addClase(clase);
            setShowAddClase(false);
          }}
        />
      )}
      {(showAddAlumno || editandoAlumno) && (
        <AddAlumnoModal
          clubes={data.clubes || []}
          alumno={editandoAlumno}
          onClose={() => {
            setShowAddAlumno(false);
            setEditandoAlumno(null);
          }}
          onSave={(a) => {
            if (editandoAlumno) {
              updateAlumno(editandoAlumno.id, a);
            } else {
              addAlumno(a.nombre, a.contacto, a.clubId);
            }
            setShowAddAlumno(false);
            setEditandoAlumno(null);
          }}
        />
      )}
      {(showAddClub || editandoClubInfo) && (
        <AddClubModal
          club={editandoClubInfo}
          onClose={() => {
            setShowAddClub(false);
            setEditandoClubInfo(null);
          }}
          onSave={(info) => {
            if (editandoClubInfo) {
              updateClub(editandoClubInfo.id, info);
            } else {
              addClub(info);
            }
            setShowAddClub(false);
            setEditandoClubInfo(null);
          }}
        />
      )}
      {reprogramando && (
        <ReprogramarModal
          clase={reprogramando}
          alumnos={data.alumnos}
          clasesExistentes={data.clases}
          plantillas={data.plantillasWhatsApp || loadData().plantillasWhatsApp}
          onClose={() => setReprogramando(null)}
          onSave={reprogramarClase}
        />
      )}
      {cancelando && (
        <CancelarModal
          clase={cancelando}
          alumnos={data.alumnos}
          plantillas={data.plantillasWhatsApp || loadData().plantillasWhatsApp}
          onClose={() => setCancelando(null)}
          onSave={cancelarClase}
        />
      )}
      {editandoClub && (
        <EditarClubModal clase={editandoClub} clubes={data.clubes || []} onClose={() => setEditandoClub(null)} onSave={editarClubDeClase} />
      )}
      {editandoHorario && (
        <EditarHorarioModal clase={editandoHorario} onClose={() => setEditandoHorario(null)} onSave={editarHorarioClase} />
      )}
      {verAlumno && (
        <AlumnoClasesModal alumno={verAlumno} clases={data.clases} clubes={data.clubes || []} onClose={() => setVerAlumno(null)} />
      )}
      {showPlantillas && (
        <PlantillasModal plantillas={data.plantillasWhatsApp || loadData().plantillasWhatsApp} onClose={() => setShowPlantillas(false)} onSave={guardarPlantillas} />
      )}
      {toast && <Toast msg={toast} />}
    </div>
  );
}

                              fechaHora: fmtFechaHoraLarga(c.fecha, c.hora),

                            );
                          })()}
                          <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                            <button
                              onClick={() => onToggleCobrado(c.id)}
                              style={{
                                ...pillBtn,
                                background: c.cobrado ? COLORS.court : "transparent",
                                color: c.cobrado ? "#fff" : COLORS.court,
                                border: `1px solid ${COLORS.court}`,
                              }}
                            >
                              <Check size={12} /> {c.cobrado ? "Cobrado" : "Pendiente"}
                            </button>
                            <button onClick={() => onEditarHorario(c)} style={{ ...pillBtn, background: "transparent", color: COLORS.court, border: `1px solid ${COLORS.court}` }}>
                              <Clock size={12} /> Editar horario
                            </button>
                            <button onClick={() => onReprogramar(c)} style={{ ...pillBtn, background: "transparent", color: COLORS.clay, border: `1px solid ${COLORS.clay}` }}>
                              <CloudRain size={12} /> Reprogramar
                            </button>
                            <button onClick={() => onCancelar(c)} style={{ ...pillBtn, background: "transparent", color: "#B23A3A", border: "1px solid #B23A3A" }}>
                              Cancelar
                            </button>
                            <button
                              onClick={() => onDelete(c.id)}
                              style={{ ...pillBtn, background: "transparent", color: COLORS.inkSoft, border: `1px solid ${COLORS.line}`, marginLeft: "auto" }}
                            >
                              <Trash2 size={12} />
                            </button>
                          </div>
                          {yaPaso && (
                            <div style={{ display: "flex", gap: 6, marginTop: 8, paddingTop: 8, borderTop: `1px dashed ${COLORS.line}` }}>
                              <span style={{ fontSize: 11, color: COLORS.inkSoft, alignSelf: "center", marginRight: 2 }}>Asistencia:</span>
                              <button
                                onClick={() => onMarcarAsistencia(c.id, "asistio")}
                                style={{
                                  ...miniPillBtn,
                                  background: c.asistencia === "asistio" ? COLORS.court : "transparent",
                                  color: c.asistencia === "asistio" ? "#fff" : COLORS.court,
                                  border: `1px solid ${COLORS.court}`,
                                }}
                              >
                                Asistió
                              </button>
                              <button
                                onClick={() => onMarcarAsistencia(c.id, "falto_aviso")}
                                style={{
                                  ...miniPillBtn,
                                  background: c.asistencia === "falto_aviso" ? COLORS.clay : "transparent",
                                  color: c.asistencia === "falto_aviso" ? "#fff" : COLORS.clay,
                                  border: `1px solid ${COLORS.clay}`,
                                }}
                              >
                                Faltó (avisó)
                              </button>
                              <button
                                onClick={() => onMarcarAsistencia(c.id, "falto_sin_aviso")}
                                style={{
                                  ...miniPillBtn,
                                  background: c.asistencia === "falto_sin_aviso" ? "#B23A3A" : "transparent",
                                  color: c.asistencia === "falto_sin_aviso" ? "#fff" : "#B23A3A",
                                  border: "1px solid #B23A3A",
                                }}
                              >
                                Sin aviso
                              </button>
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
      </div>

      <button onClick={onAddClick} style={fabStyle}>
        <Plus size={24} color="#fff" />
      </button>
    </div>
  );
}

function primerDiaMes(d) {
  return toISODateLocal(new Date(d.getFullYear(), d.getMonth(), 1));
}
function ultimoDiaMes(d) {
  return toISODateLocal(new Date(d.getFullYear(), d.getMonth() + 1, 0));
}

const HORAS_DISPONIBILIDAD = Array.from({ length: 15 }, (_, i) => i + 8); // 8:00 a 22:00

function DisponibilidadView({ data, onToggle, onLimpiarDia, onMarcarDiaCompleto, onToggleExcepcion, onSetExcepcionDiaCompleto, onLimpiarExcepcionesDia }) {
  const [subVista, setSubVista] = useState("patron"); // patron | excepciones
  const [mesRef, setMesRef] = useState(() => new Date());
  const [semanaIdx, setSemanaIdx] = useState(0);

  const disponibilidad = data.disponibilidad || [];
  const excepciones = data.disponibilidadExcepciones || {};
  const clubById = Object.fromEntries((data.clubes || []).map((c) => [c.id, c]));

  const estaDisponiblePatron = (dia, hora) => disponibilidad.includes(`${dia}-${hora}`);
  const diaCompletoPatron = (dia) => HORAS_DISPONIBILIDAD.every((h) => estaDisponiblePatron(dia, h));

  // Ocupación global (para el patrón general): cualquier clase futura o de hoy, no cancelada,
  // cruzada por día de semana + hora, sin importar el mes.
  const ocupadoPatron = new Set();
  {
    const hoyStr = toISODateLocal(new Date());
    (data.clases || [])
      .filter((c) => c.estado !== "cancelada" && c.fecha >= hoyStr)
      .forEach((c) => {
        const diaSemana = new Date(c.fecha + "T00:00:00").getDay();
        const [hh, mm] = c.hora.split(":").map(Number);
        const inicioDec = hh + mm / 60;
        const finDec = inicioDec + (c.duracionMin || 60) / 60;
        HORAS_DISPONIBILIDAD.forEach((h) => {
          if (inicioDec < h + 1 && finDec > h) ocupadoPatron.add(`${diaSemana}-${h}`);
        });
      });
  }
  const estaOcupadoPatron = (dia, hora) => ocupadoPatron.has(`${dia}-${hora}`);

  const anio = mesRef.getFullYear();
  const mes = mesRef.getMonth();
  const nombreMes = mesRef.toLocaleDateString("es-AR", { month: "long", year: "numeric" });

  // Semanas (domingo a sábado) que tocan este mes
  const semanas = [];
  {
    let cursor = startOfWeek(new Date(anio, mes, 1));
    const finMes = new Date(anio, mes + 1, 0);
    while (cursor <= finMes) {
      semanas.push(new Date(cursor));
      cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 7);
    }
  }
  const semanaBase = semanas[Math.min(semanaIdx, semanas.length - 1)] || startOfWeek(new Date(anio, mes, 1));
  const diasSemana = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(semanaBase);
    d.setDate(d.getDate() + i);
    return d;
  });

  const efectivoEnFecha = (fechaStr, diaSemana, hora) => {
    const key = `${fechaStr}-${hora}`;
    const exc = excepciones[key];
    if (exc === "on") return true;
    if (exc === "off") return false;
    return estaDisponiblePatron(diaSemana, hora);
  };
  const esExcepcion = (fechaStr, hora) => excepciones[`${fechaStr}-${hora}`] != null;

  // Ocupación real por fecha exacta
  const ocupadoInfo = {}; // key fecha-hora -> {clubId}
  (data.clases || [])
    .filter((c) => c.estado !== "cancelada")
    .forEach((c) => {
      const [hh, mm] = c.hora.split(":").map(Number);
      const inicioDec = hh + mm / 60;
      const finDec = inicioDec + (c.duracionMin || 60) / 60;
      HORAS_DISPONIBILIDAD.forEach((h) => {
        if (inicioDec < h + 1 && finDec > h) {
          ocupadoInfo[`${c.fecha}-${h}`] = { clubId: c.clubId };
        }
      });
    });

  const diaCompletoExcepcion = (fechaStr, diaSemana) => HORAS_DISPONIBILIDAD.every((h) => efectivoEnFecha(fechaStr, diaSemana, h));

  const modeBtn = (activo) => ({
    flex: 1,
    padding: "9px 0",
    borderRadius: 10,
    border: "none",
    fontSize: 13,
    fontWeight: 700,
    cursor: "pointer",
    background: activo ? COLORS.court : "#fff",
    color: activo ? "#fff" : COLORS.ink,
    boxShadow: activo ? "none" : `inset 0 0 0 1px ${COLORS.line}`,
  });

  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 4 }}>Mis horarios disponibles</div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <button style={modeBtn(subVista === "patron")} onClick={() => setSubVista("patron")}>
          Patrón general
        </button>
        <button style={modeBtn(subVista === "excepciones")} onClick={() => setSubVista("excepciones")}>
          Excepciones por fecha
        </button>
      </div>

      {subVista === "patron" ? (
        <>
          <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 12 }}>
            Esta es tu regla general: se repite todas las semanas. Tocá los bloques en los que podés dar clase habitualmente. Tocá el día para marcarlo completo o vaciarlo de una.
          </div>
          <div style={{ display: "flex", gap: 14, marginBottom: 14, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: COLORS.disponible }} /> Disponible
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: "#E8B93E" }} /> Con clase agendada (hoy o después)
            </div>
          </div>
          <div style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: "44px repeat(7, 1fr)", gap: 3, minWidth: 460 }}>
              <div />
              {DIAS_CORTO.map((d, dia) => (
                <button
                  key={dia}
                  onClick={() => (diaCompletoPatron(dia) ? onLimpiarDia(dia) : onMarcarDiaCompleto(dia, HORAS_DISPONIBILIDAD))}
                  style={{
                    border: "none",
                    borderRadius: 6,
                    padding: "6px 2px",
                    fontSize: 10.5,
                    fontWeight: 800,
                    cursor: "pointer",
                    background: diaCompletoPatron(dia) ? COLORS.disponible : COLORS.line,
                    color: diaCompletoPatron(dia) ? "#fff" : COLORS.ink,
                  }}
                >
                  {d}
                </button>
              ))}
              {HORAS_DISPONIBILIDAD.map((hora) => (
                <React.Fragment key={hora}>
                  <div style={{ fontSize: 10.5, color: COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 4 }}>
                    {String(hora).padStart(2, "0")}
                  </div>
                  {DIAS_CORTO.map((_, dia) => {
                    const activo = estaDisponiblePatron(dia, hora);
                    const ocupado = estaOcupadoPatron(dia, hora);
                    return (
                      <button
                        key={dia}
                        onClick={() => onToggle(dia, hora)}
                        title={ocupado ? "Tenés al menos una clase agendada en este horario" : undefined}
                        style={{
                          height: 26,
                          border: "none",
                          borderRadius: 4,
                          cursor: "pointer",
                          background: ocupado ? "#E8B93E" : activo ? COLORS.disponible : "#fff",
                          boxShadow: ocupado || activo ? "none" : `inset 0 0 0 1px ${COLORS.line}`,
                        }}
                      />
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>
        </>
      ) : (
        <>
          <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 12 }}>
            Acá corregís casos puntuales sin tocar tu regla general (ej: "los lunes suelo estar libre, pero este lunes 10 no").
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
            <button
              onClick={() => { setMesRef(new Date(anio, mes - 1, 1)); setSemanaIdx(0); }}
              style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: 6, cursor: "pointer" }}
            >
              <ChevronLeft size={16} />
            </button>
            <div style={{ fontWeight: 700, fontSize: 14, textTransform: "capitalize" }}>{nombreMes}</div>
            <button
              onClick={() => { setMesRef(new Date(anio, mes + 1, 1)); setSemanaIdx(0); }}
              style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: 6, cursor: "pointer" }}
            >
              <ChevronRight size={16} />
            </button>
          </div>

          <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
            {semanas.map((s, i) => {
              const fin = new Date(s);
              fin.setDate(fin.getDate() + 6);
              return (
                <button
                  key={i}
                  onClick={() => setSemanaIdx(i)}
                  style={{
                    ...chipStyle,
                    background: i === semanaIdx ? COLORS.court : "#fff",
                    color: i === semanaIdx ? "#fff" : COLORS.ink,
                    borderColor: i === semanaIdx ? COLORS.court : COLORS.line,
                  }}
                >
                  {fmtDateShort(s)}–{fmtDateShort(fin)}
                </button>
              );
            })}
          </div>

          <div style={{ display: "flex", gap: 14, marginBottom: 14, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: COLORS.disponible }} /> Libre
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, background: "#E8B93E" }} /> Con clase agendada
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft }}>
              <div style={{ width: 12, height: 12, borderRadius: 3, boxShadow: `inset 0 0 0 2px ${COLORS.clay}` }} /> Excepción puntual
            </div>
          </div>

          <div style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: "44px repeat(7, 1fr)", gap: 3, minWidth: 460 }}>
              <div />
              {diasSemana.map((d, i) => {
                const fechaStr = toISODateLocal(d);
                const esHoy = fechaStr === toISODateLocal(new Date());
                return (
                  <button
                    key={fechaStr}
                    onClick={() => onSetExcepcionDiaCompleto(fechaStr, d.getDay(), HORAS_DISPONIBILIDAD, !diaCompletoExcepcion(fechaStr, d.getDay()))}
                    style={{
                      border: esHoy ? `1.5px solid ${COLORS.clay}` : "none",
                      borderRadius: 6,
                      padding: "4px 2px",
                      fontSize: 10,
                      fontWeight: 800,
                      cursor: "pointer",
                      background: diaCompletoExcepcion(fechaStr, d.getDay()) ? COLORS.disponible : COLORS.line,
                      color: diaCompletoExcepcion(fechaStr, d.getDay()) ? "#fff" : COLORS.ink,
                      lineHeight: 1.3,
                    }}
                  >
                    {DIAS_CORTO[d.getDay()]}
                    <br />
                    {d.getDate()}
                  </button>
                );
              })}

              {HORAS_DISPONIBILIDAD.map((hora) => (
                <React.Fragment key={hora}>
                  <div style={{ fontSize: 10.5, color: COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 4 }}>
                    {String(hora).padStart(2, "0")}
                  </div>
                  {diasSemana.map((d) => {
                    const fechaStr = toISODateLocal(d);
                    const diaSemana = d.getDay();
                    const activo = efectivoEnFecha(fechaStr, diaSemana, hora);
                    const ocupInfo = ocupadoInfo[`${fechaStr}-${hora}`];
                    const esExc = esExcepcion(fechaStr, hora);
                    let bg = "#fff";
                    let sombra = `inset 0 0 0 1px ${COLORS.line}`;
                    if (ocupInfo) {
                      bg = "#E8B93E";
                      sombra = "none";
                    } else if (activo) {
                      bg = COLORS.court;
                      sombra = "none";
                    }
                    if (esExc) sombra = `inset 0 0 0 2px ${COLORS.clay}`;
                    return (
                      <button
                        key={fechaStr}
                        onClick={() => onToggleExcepcion(fechaStr, diaSemana, hora)}
                        title={ocupInfo ? `Clase agendada · ${fechaStr}` : esExc ? "Excepción puntual" : undefined}
                        style={{ height: 26, border: "none", borderRadius: 4, cursor: "pointer", background: bg, boxShadow: sombra }}
                      />
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>

          <button
            onClick={() => diasSemana.forEach((d) => onLimpiarExcepcionesDia(toISODateLocal(d)))}
            style={{ marginTop: 12, background: "none", border: "none", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: 0 }}
          >
            Borrar excepciones de esta semana (volver al patrón general)
          </button>
        </>
      )}

      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 18 }}>
        Esta disponibilidad es la base para cuando un club pueda asignarte clases directamente en los horarios que marques libres, sin tener que consultarte antes.
      </div>
    </div>
  );
}

function ResumenView({ data }) {
  const now = new Date();
  const clubes = data.clubes || [];
  const clubById = Object.fromEntries(clubes.map((c) => [c.id, c]));

  const [desde, setDesde] = useState(primerDiaMes(now));
  const [hasta, setHasta] = useState(ultimoDiaMes(now));
  const [clubFiltro, setClubFiltro] = useState("todos");

  const clasesDelRango = data.clases.filter((c) => c.fecha >= desde && c.fecha <= hasta);
  const clasesFiltradas = clasesDelRango.filter(
    (c) => clubFiltro === "todos" || (clubFiltro === "particular" ? !c.clubId : c.clubId === clubFiltro)
  );

  const clasesActivas = clasesFiltradas.filter((c) => c.estado !== "cancelada");
  const canceladas = clasesFiltradas.filter((c) => c.estado === "cancelada");
  const ausenciasSinAviso = clasesFiltradas.filter((c) => c.asistencia === "falto_sin_aviso").length;

  const totalFacturado = clasesActivas.reduce((s, c) => s + Number(c.precio || 0), 0);
  const totalCobrado = clasesActivas.filter((c) => c.cobrado).reduce((s, c) => s + Number(c.precio || 0), 0);
  const totalPendiente = totalFacturado - totalCobrado;
  const gananciaNeta = clasesActivas.reduce((s, c) => s + calcularGanancia(c), 0);

  // El detalle final por club siempre muestra todos los clubes del rango, sin importar el filtro elegido arriba
  const clasesActivasRango = clasesDelRango.filter((c) => c.estado !== "cancelada");
  const porClub = {};
  clasesActivasRango.forEach((c) => {
    const key = c.clubId || "particular";
    if (!porClub[key]) porClub[key] = { ganancia: 0, facturado: 0, cantidad: 0 };
    porClub[key].ganancia += calcularGanancia(c);
    porClub[key].facturado += Number(c.precio || 0);
    porClub[key].cantidad += 1;
  });

  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 12 }}>Resumen</div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <div style={{ flex: 1 }}>
          <Label>Desde</Label>
          <input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} style={inputStyle} />
        </div>
        <div style={{ flex: 1 }}>
          <Label>Hasta</Label>
          <input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} style={inputStyle} />
        </div>
      </div>

      {clubes.length > 0 && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
          <button
            onClick={() => setClubFiltro("todos")}
            style={{ ...chipStyle, background: clubFiltro === "todos" ? COLORS.ink : "#fff", color: clubFiltro === "todos" ? "#fff" : COLORS.ink, borderColor: clubFiltro === "todos" ? COLORS.ink : COLORS.line }}
          >
            Todos
          </button>
          <button
            onClick={() => setClubFiltro("particular")}
            style={{ ...chipStyle, background: clubFiltro === "particular" ? COLORS.ink : "#fff", color: clubFiltro === "particular" ? "#fff" : COLORS.ink, borderColor: clubFiltro === "particular" ? COLORS.ink : COLORS.line }}
          >
            Particular
          </button>
          {clubes.map((cl) => (
            <button
              key={cl.id}
              onClick={() => setClubFiltro(cl.id)}
              style={{ ...chipStyle, background: clubFiltro === cl.id ? cl.color : "#fff", color: clubFiltro === cl.id ? "#fff" : COLORS.ink, borderColor: clubFiltro === cl.id ? cl.color : COLORS.line }}
            >
              {cl.nombre}
            </button>
          ))}
        </div>
      )}

      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>
        {clasesActivas.length} clases
        {canceladas.length > 0 ? ` · ${canceladas.length} canceladas` : ""}
        {ausenciasSinAviso > 0 ? ` · ${ausenciasSinAviso} ausencias sin aviso` : ""}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <StatCard label="Facturado" value={fmtMoney(totalFacturado)} color={COLORS.ink} />
        <StatCard label="Tu ganancia" value={fmtMoney(gananciaNeta)} color={COLORS.court} big />
        <StatCard label="Cobrado" value={fmtMoney(totalCobrado)} color={COLORS.court} />
        <StatCard label="Pendiente" value={fmtMoney(totalPendiente)} color={COLORS.clay} />
      </div>

      {clasesFiltradas.length === 0 && (
        <div style={{ color: COLORS.inkSoft, fontSize: 14, marginTop: 20 }}>
          No hay clases cargadas en ese rango{clubFiltro !== "todos" ? " para ese club" : ""}.
        </div>
      )}

      {Object.keys(porClub).length > 0 && (
        <div style={{ marginTop: 22 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 2 }}>Detalle por club</div>
          <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 8 }}>Facturado trabajado en el período, sin importar el filtro de arriba</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {Object.entries(porClub).map(([key, info]) => (
              <div key={key} style={{ ...cardStyle, padding: "10px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: key === "particular" ? COLORS.inkSoft : clubById[key]?.color }} />
                    <span style={{ fontSize: 13.5, fontWeight: 600 }}>{key === "particular" ? "Particular" : clubById[key]?.nombre || "Club eliminado"}</span>
                    <span style={{ fontSize: 11.5, color: COLORS.inkSoft }}>· {info.cantidad} clases</span>
                  </div>
                  <span style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.court }}>{fmtMoney(info.ganancia)}</span>
                </div>
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 3, marginLeft: 16 }}>
                  Facturado total: {fmtMoney(info.facturado)}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function StatCard({ label, value, color, big }) {
  return (
    <div style={{ ...cardStyle, gridColumn: big ? "span 2" : "span 1" }}>
      <div style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</div>
      <div style={{ fontSize: big ? 30 : 22, fontWeight: 800, color, marginTop: 4 }}>{value}</div>
    </div>
  );
}

function ModalShell({ title, onClose, children }) {
  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(0,0,0,0.4)",
        display: "flex",
        alignItems: "flex-end",
        zIndex: 200,
      }}
      onClick={onClose}
    >
      <div
        style={{
          background: COLORS.bg,
          width: "100%",
          maxHeight: "88vh",
          overflowY: "auto",
          borderRadius: "18px 18px 0 0",
          padding: 20,
          paddingBottom: 32,
        }}
        onClick={(e) => e.stopPropagation()}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontWeight: 800, fontSize: 17 }}>{title}</div>

function AddClaseModal({ alumnos, clubes, clasesExistentes, onClose, onSave }) {
  const [seleccion, setSeleccion] = useState([]);
  const [fecha, setFecha] = useState(new Date().toISOString().slice(0, 10));
  const [hora, setHora] = useState("09:00");
  const [duracionMin, setDuracionMin] = useState(60);
  const [precio, setPrecio] = useState("");
  const [porcentaje, setPorcentaje] = useState("100");
  const [montoFijo, setMontoFijo] = useState("");
  const [modoAbono, setModoAbono] = useState(false);
  const [clubId, setClubId] = useState(null);
  const [busquedaAlumno, setBusquedaAlumno] = useState("");
  const [nuevoContacto, setNuevoContacto] = useState("");
  const [mostrarLista, setMostrarLista] = useState(false);

  const aplicarClub = (id) => {
    setClubId(id);
    const club = (clubes || []).find((cl) => cl.id === id);
    if (club && club.gananciaTipo === "monto") {
      setMontoFijo(String(club.gananciaValor ?? ""));
      setPorcentaje("100");
    } else if (club) {
      setPorcentaje(String(club.gananciaValor ?? 100));
      setMontoFijo("");
    } else {
      setMontoFijo("");
    }
  };

  const horaFin = addMinutos(hora, duracionMin);

  const fechasAbono = modoAbono ? fechasDelMesPorDiaSemana(fecha) : [fecha];
  const totalAbono = fechasAbono.length * Number(precio || 0);

  const conflictosAbono = modoAbono
    ? fechasAbono.filter((f) =>
        (clasesExistentes || []).some((c) => {
          if (c.estado === "cancelada" || c.fecha !== f) return false;
          const finExistente = addMinutos(c.hora, c.duracionMin || 60);
          return rangosSuperponen(hora, horaFin, c.hora, finExistente);
        })
      )
    : [];

  const superpuesta = (clasesExistentes || []).find((c) => {
    if (c.estado === "cancelada" || c.fecha !== fecha) return false;
    const finExistente = addMinutos(c.hora, c.duracionMin || 60);
    return rangosSuperponen(hora, horaFin, c.hora, finExistente);
  });

  const toggleAlumno = (a) => {
    setSeleccion((prev) => {
      const exists = prev.find((x) => x.id === a.id);
      if (exists) return prev.filter((x) => x.id !== a.id);
      if (prev.length >= 4) return prev;
      if (prev.length === 0 && clubId === null && a.clubId) {
        aplicarClub(a.clubId);
      }
      return [...prev, a];
    });
  };

  const addNuevoAdHoc = () => {
    if (!busquedaAlumno.trim() || seleccion.length >= 4) return;
    setSeleccion((prev) => [...prev, { id: uid(), nombre: busquedaAlumno.trim(), contacto: nuevoContacto.trim(), adhoc: true }]);
    setBusquedaAlumno("");
    setNuevoContacto("");
    setMostrarLista(false);
  };

  const alumnosFiltrados =
    busquedaAlumno.trim().length === 0
      ? []
      : alumnos.filter(
          (a) => a.nombre.toLowerCase().includes(busquedaAlumno.trim().toLowerCase()) && !seleccion.find((s) => s.id === a.id)
        );

  const yaExisteExacto = alumnos.some((a) => a.nombre.toLowerCase() === busquedaAlumno.trim().toLowerCase());

  const puedeGuardar = seleccion.length > 0 && fecha && hora && precio;

  return (
    <ModalShell title="Nueva clase" onClose={onClose}>
      {clubes && clubes.length > 0 && (
        <>
          <Label>Club / lugar</Label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
            <button
              onClick={() => aplicarClub(null)}
              style={{
                ...chipStyle,
                background: clubId === null ? COLORS.ink : "#fff",
                color: clubId === null ? "#fff" : COLORS.ink,
                borderColor: clubId === null ? COLORS.ink : COLORS.line,
              }}
            >
              Particular
            </button>
            {clubes.map((cl) => (
              <button
                key={cl.id}
                onClick={() => aplicarClub(cl.id)}
                style={{
                  ...chipStyle,
                  background: clubId === cl.id ? cl.color : "#fff",
                  color: clubId === cl.id ? "#fff" : COLORS.ink,
                  borderColor: clubId === cl.id ? cl.color : COLORS.line,
                }}
              >
                {cl.nombre}
              </button>
            ))}
          </div>
        </>
      )}

      <Label>Alumnos (hasta 4)</Label>

      {seleccion.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
          {seleccion.map((s) => (
            <button
              key={s.id}
              onClick={() => toggleAlumno(s)}
              style={{ ...chipStyle, background: COLORS.court, color: "#fff", borderColor: COLORS.court, display: "flex", alignItems: "center", gap: 5 }}
            >
              {s.nombre} <span style={{ fontWeight: 900 }}>✕</span>
            </button>
          ))}
        </div>
      )}

      {seleccion.length < 4 && (
        <div style={{ position: "relative", marginBottom: 6 }}>
          <input
            value={busquedaAlumno}
            onChange={(e) => {
              setBusquedaAlumno(e.target.value);
              setMostrarLista(true);
            }}
            onFocus={() => setMostrarLista(true)}
            placeholder="🔍 Buscar alumno por nombre..."
            style={inputStyle}
          />
          {mostrarLista && busquedaAlumno.trim().length > 0 && (
            <div
              style={{
                position: "absolute",
                top: "100%",
                left: 0,
                right: 0,
                background: "#fff",
                border: `1px solid ${COLORS.line}`,
                borderRadius: 10,
                marginTop: 4,
                maxHeight: 220,
                overflowY: "auto",
                zIndex: 10,
                boxShadow: "0 8px 20px rgba(0,0,0,0.12)",
              }}
            >
              {alumnosFiltrados.map((a) => (
                <button
                  key={a.id}
                  onClick={() => {
                    toggleAlumno(a);
                    setBusquedaAlumno("");
                    setMostrarLista(false);
                  }}
                  style={{
                    display: "block",
                    width: "100%",
                    textAlign: "left",
                    padding: "10px 12px",
                    border: "none",
                    background: "none",
                    borderBottom: `1px solid ${COLORS.line}`,
                    cursor: "pointer",
                    fontSize: 14,
                  }}
                >
                  {a.nombre}
                </button>
              ))}
              {!yaExisteExacto && (
                <div style={{ padding: 12 }}>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 6 }}>
                    No encontrado. Cargar "{busquedaAlumno.trim()}" como alumno nuevo:
                  </div>
                  <input
                    value={nuevoContacto}
                    onChange={(e) => setNuevoContacto(e.target.value)}
                    placeholder="Teléfono (opcional)"
                    style={{ ...inputStyle, marginBottom: 8, fontSize: 13, padding: "8px 10px" }}
                  />
                  <button onClick={addNuevoAdHoc} style={{ ...pillBtn, background: COLORS.court, color: "#fff", border: "none", width: "100%", justifyContent: "center" }}>
                    + Agregar como alumno nuevo
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      )}
      {seleccion.length > 0 && (
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 14 }}>
          Clase de {seleccion.length} alumno{seleccion.length > 1 ? "s" : ""}: {seleccion.map((s) => s.nombre).join(", ")}
        </div>
      )}

      <Label>Fecha {modoAbono ? "de la primera clase" : ""}</Label>
      <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />

      <div
        onClick={() => setModoAbono((v) => !v)}
        style={{
          display: "flex",
          alignItems: "center",
          gap: 10,
          padding: "10px 12px",
          borderRadius: 10,
          border: `1px solid ${modoAbono ? COLORS.court : COLORS.line}`,
          background: modoAbono ? "#EAF2EF" : "#fff",
          marginBottom: 14,
          cursor: "pointer",
        }}
      >
        <div
          style={{
            width: 18,
            height: 18,
            borderRadius: 5,
            border: `2px solid ${modoAbono ? COLORS.court : COLORS.inkSoft}`,
            background: modoAbono ? COLORS.court : "transparent",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            flexShrink: 0,
          }}
        >
          {modoAbono && <Check size={12} color="#fff" />}
        </div>
        <div>
          <div style={{ fontWeight: 700, fontSize: 13.5 }}>Abono mensual (repetir cada semana)</div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft }}>
            Reserva automáticamente el mismo día y horario todas las semanas hasta fin de mes.
          </div>
        </div>
      </div>

      <Label>Horario</Label>
      <input type="time" value={hora} onChange={(e) => setHora(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />

      <Label>Duración</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 4 }}>
        {[
          { label: "1 h", min: 60 },
          { label: "1:30 h", min: 90 },
          { label: "2 h", min: 120 },
          { label: "2:30 h", min: 150 },
        ].map((opt) => (
          <button
            key={opt.min}
            onClick={() => setDuracionMin(opt.min)}
            style={{
              ...chipStyle,
              background: duracionMin === opt.min ? COLORS.court : "#fff",
              color: duracionMin === opt.min ? "#fff" : COLORS.ink,
              borderColor: duracionMin === opt.min ? COLORS.court : COLORS.line,
            }}
          >
            {opt.label}
          </button>
        ))}
      </div>
      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 12 }}>
        Termina a las {horaFin} — se agenda de una vez, no hace falta cargarla en dos partes.
      </div>

      <Label>Precio {modoAbono ? "por clase" : "total de la clase"}</Label>
      <input
        type="number"
        inputMode="numeric"
        value={precio}
        onChange={(e) => setPrecio(e.target.value)}
        placeholder="Ej: 8000"
        style={{ ...inputStyle, marginBottom: modoAbono ? 6 : 12 }}
      />

      {modoAbono && (
        <div style={{ background: COLORS.clayLight, borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink }}>
            {fechasAbono.length} clases este mes ({DIAS[new Date(fecha + "T00:00:00").getDay()]}s)
          </div>
          <div style={{ fontSize: 13, color: COLORS.ink, marginTop: 2 }}>
            Total del mes: <strong>{fmtMoney(totalAbono)}</strong>
          </div>
          {conflictosAbono.length > 0 && (
            <div style={{ fontSize: 12, color: "#B23A3A", marginTop: 6, fontWeight: 600 }}>
              ⚠ {conflictosAbono.length} de esas fechas se superponen con clases que ya tenés agendadas.
            </div>
          )}
        </div>
      )}

      {montoFijo !== "" ? (
        <>
          <Label>Tu ganancia fija por esta clase</Label>
          <input
            type="number"
            inputMode="numeric"
            value={montoFijo}
            onChange={(e) => setMontoFijo(e.target.value)}
            placeholder="Ej: 5000"
            style={{ ...inputStyle, marginBottom: 4 }}
          />
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 4 }}>
            Autocompletado desde la configuración del club. Podés cambiarlo para esta clase puntual.
          </div>
          <button
            onClick={() => setMontoFijo("")}
            style={{ background: "none", border: "none", color: COLORS.court, fontSize: 12, fontWeight: 700, padding: 0, marginBottom: 18, cursor: "pointer" }}
          >
            Usar % en vez de monto fijo
          </button>
        </>
      ) : (
        <>
          <Label>% que te queda a vos</Label>
          <input
            type="number"
            inputMode="numeric"
            value={porcentaje}
            onChange={(e) => setPorcentaje(e.target.value)}
            placeholder="100"
            style={{ ...inputStyle, marginBottom: 4 }}
          />
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 18 }}>
            Usalo si alquilás cancha o trabajás para un club (ej: 70% para vos, 30% cancha). Se autocompleta según la configuración de cada club.
          </div>
        </>
      )}

      {superpuesta && (
        <div
          style={{
            background: "#FBE4E4",
            border: "1.5px solid #B23A3A",
            borderRadius: 10,
            padding: "10px 12px",
            marginBottom: 12,
            fontSize: 13,
            color: "#8A2A2A",
            fontWeight: 700,
          }}
        >
          ⚠ Se pisa con la clase de {superpuesta.alumnosNombres.join(", ")} ({superpuesta.hora} - {addMinutos(superpuesta.hora, superpuesta.duracionMin || 60)}). Revisá el horario antes de guardar.
        </div>
      )}

      <button
        disabled={!puedeGuardar}
        onClick={() =>
          modoAbono
            ? onSave({
                multiple: true,
                fechas: fechasAbono,
                hora,
                duracionMin,
                precio: Number(precio),
                porcentaje: Number(porcentaje) || 100,
                alumnosNombres: seleccion.map((s) => s.nombre),
                abonoId: uid(),
                clubId,
                montoFijo: montoFijo !== "" ? Number(montoFijo) : null,
                nuevosAlumnos: seleccion.filter((s) => s.adhoc).map((s) => ({ id: s.id, nombre: s.nombre, contacto: s.contacto || "", clubId })),
              })
            : onSave({
                fecha,
                hora,
                duracionMin,
                precio: Number(precio),
                porcentaje: Number(porcentaje) || 100,
                alumnosNombres: seleccion.map((s) => s.nombre),
                clubId,
                montoFijo: montoFijo !== "" ? Number(montoFijo) : null,
                nuevosAlumnos: seleccion.filter((s) => s.adhoc).map((s) => ({ id: s.id, nombre: s.nombre, contacto: s.contacto || "", clubId })),
              })
        }
        style={{
          ...primaryBtn,
          background: superpuesta ? "#B23A3A" : primaryBtn.background,
          opacity: puedeGuardar ? 1 : 0.4,
        }}
      >
        {superpuesta
          ? "Guardar de todos modos (se pisa)"
          : modoAbono
          ? `Agendar ${fechasAbono.length} clases del mes`
          : "Guardar clase"}
      </button>
    </ModalShell>
  );
}

function ClubesView({ data, onAddClick, onDelete, onEdit }) {
  const clubes = data.clubes || [];
  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 4 }}>Clubes ({clubes.length})</div>
      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 14 }}>
        Si das clases en más de un lugar, agregalos acá para llevar cada agenda distinguida y evitar que se te crucen horarios entre clubes.
      </div>
      {clubes.length === 0 && (
        <div style={{ color: COLORS.inkSoft, fontSize: 14, marginBottom: 16 }}>Todavía no agregaste ningún club/cancha.</div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {clubes.map((c) => (
          <div key={c.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: c.color }} />
              <div>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{c.nombre}</div>
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 1 }}>
                  {c.gananciaTipo === "monto" ? `Ganancia fija: ${fmtMoney(c.gananciaValor)}/clase` : `Ganancia por defecto: ${c.gananciaValor ?? 100}%`}
                </div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 4 }}>
              <button onClick={() => onEdit(c)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", padding: 6 }}>
                <Pencil size={16} />
              </button>
              <button onClick={() => onDelete(c.id)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", padding: 6 }}>
                <Trash2 size={16} />
              </button>
            </div>
          </div>
        ))}
      </div>
      <button onClick={onAddClick} style={fabStyle}>
        <Plus size={24} color="#fff" />
      </button>
    </div>
  );
}

function AddClubModal({ club, onClose, onSave }) {
  const [nombre, setNombre] = useState(club?.nombre || "");
  const [gananciaTipo, setGananciaTipo] = useState(club?.gananciaTipo || "porcentaje");
  const [gananciaValor, setGananciaValor] = useState(club?.gananciaValor != null ? String(club.gananciaValor) : "100");

  return (
    <ModalShell title={club ? "Editar club" : "Nuevo club / cancha"} onClose={onClose}>
      <Label>Nombre</Label>
      <input value={nombre} onChange={(e) => setNombre(e.target.value)} style={{ ...inputStyle, marginBottom: 16 }} placeholder="Ej: Club Norte, Cancha de Juan..." />

      <Label>Tu ganancia por defecto en este club</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        <button
          onClick={() => setGananciaTipo("porcentaje")}
          style={{
            ...chipStyle,
            background: gananciaTipo === "porcentaje" ? COLORS.court : "#fff",
            color: gananciaTipo === "porcentaje" ? "#fff" : COLORS.ink,
            borderColor: gananciaTipo === "porcentaje" ? COLORS.court : COLORS.line,
          }}
        >
          % del precio
        </button>
        <button
          onClick={() => setGananciaTipo("monto")}
          style={{
            ...chipStyle,
            background: gananciaTipo === "monto" ? COLORS.court : "#fff",
            color: gananciaTipo === "monto" ? "#fff" : COLORS.ink,
            borderColor: gananciaTipo === "monto" ? COLORS.court : COLORS.line,
          }}
        >
          Monto fijo por clase
        </button>
      </div>
      <input
        type="number"
        inputMode="numeric"
        value={gananciaValor}
        onChange={(e) => setGananciaValor(e.target.value)}
        placeholder={gananciaTipo === "porcentaje" ? "Ej: 70" : "Ej: 5000"}
        style={{ ...inputStyle, marginBottom: 6 }}
      />
      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 18 }}>
        {gananciaTipo === "porcentaje"
          ? "Se autocompleta al elegir este club en una clase nueva. Siempre lo podés cambiar a mano en esa clase puntual."
          : "Cobrás este monto fijo por clase en este club, sin importar el precio que le cobrás al alumno. También editable a mano si hace falta."}
      </div>

      <button disabled={!nombre.trim()} onClick={() => onSave({ nombre: nombre.trim(), gananciaTipo, gananciaValor: Number(gananciaValor) || 0 })} style={{ ...primaryBtn, opacity: nombre.trim() ? 1 : 0.4 }}>
        {club ? "Guardar cambios" : "Guardar club"}
      </button>
    </ModalShell>
  );
}

function AddAlumnoModal({ clubes, alumno, onClose, onSave }) {
  const [nombre, setNombre] = useState(alumno?.nombre || "");

        {alumno ? "Guardar cambios" : "Guardar alumno"}

function ReprogramarModal({ clase, alumnos, clasesExistentes, plantillas, onClose, onSave }) {
  const [fecha, setFecha] = useState(clase.fecha);
  const [hora, setHora] = useState(clase.hora);
  const [motivo, setMotivo] = useState("Lluvia");

  const duracion = clase.duracionMin || 60;
  const horaFin = addMinutos(hora, duracion);
  const superpuesta = (clasesExistentes || []).find((c) => {
    if (c.id === clase.id || c.estado === "cancelada" || c.fecha !== fecha) return false;
    const finExistente = addMinutos(c.hora, c.duracionMin || 60);
    return rangosSuperponen(hora, horaFin, c.hora, finExistente);
  });

  const alumnosConTel = clase.alumnosNombres
    .map((n) => (alumnos || []).find((a) => a.nombre === n))
    .filter((a) => a && a.contacto);
  const mensajeWa = armarMensajeWa(plantillas.reprogramacion, {
    fechaHoraOriginal: fmtFechaHoraLarga(clase.fecha, clase.hora),
    fechaHoraNueva: fmtFechaHoraLarga(fecha, hora),
    motivo: motivo.toLowerCase(),
  });

  return (
    <ModalShell title="Reprogramar clase" onClose={onClose}>
      <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginBottom: 14 }}>
        {clase.alumnosNombres.join(", ")} · originalmente {fmtFechaHoraLarga(clase.fecha, clase.hora)}
      </div>
      <Label>Motivo</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {["Lluvia", "Alumno", "Profe", "Otro"].map((m) => (
          <button
            key={m}
            onClick={() => setMotivo(m)}
            style={{
              ...chipStyle,
              background: motivo === m ? COLORS.clay : "#fff",
              color: motivo === m ? "#fff" : COLORS.ink,
              borderColor: motivo === m ? COLORS.clay : COLORS.line,
            }}
          >
            {m}
          </button>
        ))}
      </div>
      <Label>Nueva fecha</Label>
      <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />
      <Label>Nuevo horario</Label>
      <input type="time" value={hora} onChange={(e) => setHora(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />

      {superpuesta && (
        <div
          style={{
            background: "#FBE4E4",
            border: "1.5px solid #B23A3A",
            borderRadius: 10,
            padding: "10px 12px",
            marginBottom: 12,
            fontSize: 13,
            color: "#8A2A2A",
            fontWeight: 700,
          }}
        >
          ⚠ Se pisa con la clase de {superpuesta.alumnosNombres.join(", ")} ({superpuesta.hora} - {addMinutos(superpuesta.hora, superpuesta.duracionMin || 60)}).
        </div>
      )}

      <button onClick={() => onSave(clase.id, fecha, hora, motivo)} style={{ ...primaryBtn, background: superpuesta ? "#B23A3A" : primaryBtn.background, marginBottom: superpuesta ? 4 : 0 }}>
        {superpuesta ? "Reprogramar de todos modos (se pisa)" : "Confirmar reprogramación"}
      </button>
      {alumnosConTel.length > 0 && (
        <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
          {alumnosConTel.map((a) => (
            <a
              key={a.id}
              href={linkWhatsApp(a.contacto, mensajeWa)}
              target="_blank"
              rel="noreferrer"
              style={{ ...pillBtn, background: "#25D366", color: "#fff", border: "none", textDecoration: "none" }}
            >
              <MessageCircle size={12} /> Avisar a {a.nombre.split(" ")[0]}
            </a>
          ))}
        </div>
      )}
    </ModalShell>
  );
}

          onClick={() => setConAviso(true)}

function AlumnoClasesModal({ alumno, clases, clubes, onClose }) {
  const clubById = Object.fromEntries(clubes.map((c) => [c.id, c]));
  const now = new Date();

  const clasesDelAlumno = clases
    .filter((c) => c.alumnosNombres.includes(alumno.nombre))
    .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

  const proximas = clasesDelAlumno.filter((c) => new Date(c.fecha + "T" + c.hora) >= now && c.estado !== "cancelada");
  const anteriores = clasesDelAlumno.filter((c) => new Date(c.fecha + "T" + c.hora) < now || c.estado === "cancelada").reverse();

  const renderClase = (c) => (
    <div key={c.id} style={{ ...cardStyle, padding: "10px 14px", opacity: c.estado === "cancelada" ? 0.6 : 1 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 14 }}>
            {fmtFechaHoraLarga(c.fecha, c.hora)}
          </div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2, display: "flex", alignItems: "center", gap: 6 }}>
            {c.clubId && clubById[c.clubId] && (
              <span style={{ fontSize: 10, fontWeight: 700, color: "#fff", background: clubById[c.clubId].color, padding: "1px 6px", borderRadius: 7 }}>
                {clubById[c.clubId].nombre}
              </span>
            )}
            {c.estado === "cancelada"
              ? "Cancelada"
              : c.asistencia === "asistio"
              ? "Asistió"
              : c.asistencia === "falto_aviso"
              ? "Faltó (avisó)"
              : c.asistencia === "falto_sin_aviso"
              ? "Faltó sin aviso"
              : c.cobrado
              ? "Cobrado"
              : "Pendiente"}
          </div>
        </div>
        <div style={{ fontWeight: 700, fontSize: 13.5 }}>{fmtMoney(c.precio)}</div>
      </div>
    </div>
  );

  return (
    <ModalShell title={alumno.nombre} onClose={onClose}>
      {alumno.contacto && <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>{alumno.contacto}</div>}

      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8 }}>Próximas clases ({proximas.length})</div>
      {proximas.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 20 }}>No tiene clases agendadas.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 20 }}>{proximas.map(renderClase)}</div>
      )}

      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8 }}>Historial ({anteriores.length})</div>
      {anteriores.length === 0 ? (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Todavía no tiene clases pasadas.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{anteriores.map(renderClase)}</div>
      )}
    </ModalShell>
  );
}

function LoginScreen({ onLogged }) {
  const [modo, setModo] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);
  const [aviso, setAviso] = useState("");

  const submit = async () => {
    setError("");
    setAviso("");

    if (modo === "recover") {
      if (!email.trim()) { setError("Ingresá tu email."); return; }
      setCargando(true);
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: window.location.origin + window.location.pathname,
        });
        if (error) setError(error.message);
        else setAviso("Listo, te mandamos un email con el link para elegir una nueva contraseña.");
      } catch (e) {
        setError("Ocurrió un error. Probá de nuevo.");
      } finally {
        setCargando(false);
      }
      return;
    }

    if (!email.trim() || !password) {
      setError("Completá email y contraseña.");
      return;
    }
    setCargando(true);
    try {
      if (modo === "login") {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
        if (error) {
          setError(error.message === "Invalid login credentials" ? "Email o contraseña incorrectos." : error.message);
        } else if (data.session) {
          onLogged(data.session);
        }
      } else {
        const { data, error } = await supabaseClient.auth.signUp({ email: email.trim(), password });
        if (error) {
          setError(error.message);
        } else if (data.session) {
          onLogged(data.session);
        } else {
          setAviso("Si ese email es nuevo, te llegará un correo para confirmarlo. Si ya tenías cuenta, no se modificó nada: iniciá sesión con tu contraseña de siempre.");
        }
      }
    } catch (e) {
      setError("Ocurrió un error. Probá de nuevo.");
    } finally {
      setCargando(false);
    }
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#B85C2E",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif",
        padding: 20,
      }}
    >
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 380 }}>
          <svg height="30" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" style={{ display: "block", margin: "0 auto 14px" }}>
            <defs><clipPath id="loginRoundedSquare"><rect x="40" y="40" width="440" height="440" rx="70" ry="70" /></clipPath></defs>
            <g clipPath="url(#loginRoundedSquare)">
              <rect x="40" y="40" width="440" height="440" fill="#B85C2E" />
              <circle cx="380" cy="150" r="42" fill="#B8D91A" />
              <path d="M 40 350 Q 155 300 260 335 Q 370 372 480 335 L 480 480 L 40 480 Z" fill="#B8D91A" />
              <circle cx="150" cy="175" r="16" fill="#FAF9F6" />
              <rect x="142" y="188" width="16" height="150" fill="#FAF9F6" />
              <path d="M 150 198 Q 270 210 420 268" fill="none" stroke="#FAF9F6" strokeWidth="13" strokeLinecap="round" />
              <path d="M 95 340 Q 270 278 420 335" fill="none" stroke="#FAF9F6" strokeWidth="13" strokeLinecap="round" />
              <g stroke="#FAF9F6" strokeWidth="9" strokeLinecap="round">
                <line x1="150" y1="202" x2="135" y2="337" /><line x1="217" y1="205" x2="212" y2="330" />
                <line x1="285" y1="214" x2="285" y2="322" /><line x1="352" y1="234" x2="358" y2="325" />
                <line x1="420" y1="268" x2="420" y2="335" />
              </g>
            </g>
            <rect x="40" y="40" width="440" height="440" rx="70" ry="70" fill="none" stroke="#FAF9F6" strokeWidth="6" />
          </svg>
        <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 20, color: COLORS.ink, textAlign: "center" }}>
          {modo === "login" ? "Ingresá a tu cuenta" : modo === "signup" ? "Creá tu cuenta" : "Recuperar contraseña"}
        </div>

        <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 6, textTransform: "uppercase" }}>Email</div>
        <input
          type="email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="tu@email.com"
          style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 12, boxSizing: "border-box" }}
        />

        {modo !== "recover" && (
          <>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 6, textTransform: "uppercase" }}>Contraseña</div>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="••••••••"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 16, boxSizing: "border-box" }}
            />
          </>
        )}

        {error && <div style={{ color: "#B23A3A", fontSize: 13, marginBottom: 12, fontWeight: 600 }}>{error}</div>}
        {aviso && <div style={{ color: COLORS.court, fontSize: 13, marginBottom: 12, fontWeight: 600 }}>{aviso}</div>}

        <button
          onClick={submit}
          disabled={cargando}
          style={{ width: "100%", background: COLORS.court, color: "#fff", border: "none", padding: "13px 0", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer", opacity: cargando ? 0.6 : 1 }}
        >
          {cargando ? "Un momento..." : modo === "login" ? "Ingresar" : modo === "signup" ? "Crear cuenta" : "Enviar link de recuperación"}
        </button>

        {modo === "login" && (
          <button
            onClick={() => { setModo("recover"); setError(""); setAviso(""); }}

function SetNewPasswordScreen({ onDone }) {
  const [password, setPassword] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);
  const [ok, setOk] = useState(false);

  const submit = async () => {
    setError("");
    if (password.length < 6) { setError("La contraseña debe tener al menos 6 caracteres."); return; }
    if (password !== confirmar) { setError("Las contraseñas no coinciden."); return; }
    setCargando(true);
    const { error } = await supabaseClient.auth.updateUser({ password });
    setCargando(false);
    if (error) setError(error.message);
    else setOk(true);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#B85C2E", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 380 }}>
        <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 18, color: COLORS.ink }}>Elegí tu nueva contraseña</div>
        {ok ? (
          <>
            <div style={{ color: COLORS.court, fontSize: 14, fontWeight: 600, marginBottom: 18 }}>Contraseña actualizada correctamente.</div>
            <button onClick={onDone} style={{ width: "100%", background: COLORS.court, color: "#fff", border: "none", padding: "13px 0", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
              Continuar
            </button>
          </>
        ) : (
          <>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="Nueva contraseña"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 12, boxSizing: "border-box" }}
            />
            <input
              type="password"
              value={confirmar}
              onChange={(e) => setConfirmar(e.target.value)}
              placeholder="Repetir contraseña"
              style={{ width: "100%", padding: "11px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, fontSize: 15, marginBottom: 16, boxSizing: "border-box" }}
            />
            {error && <div style={{ color: "#B23A3A", fontSize: 13, marginBottom: 12, fontWeight: 600 }}>{error}</div>}
            <button
              onClick={submit}
              disabled={cargando}
              style={{ width: "100%", background: COLORS.court, color: "#fff", border: "none", padding: "13px 0", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer", opacity: cargando ? 0.6 : 1 }}
            >
              {cargando ? "Un momento..." : "Guardar nueva contraseña"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function ProfesView({ club, onClubUpdate, showToast }) {
  const [vinculos, setVinculos] = useState(null);
  const [showInvitar, setShowInvitar] = useState(false);
  const [showPlantilla, setShowPlantilla] = useState(false);
  const [verDisp, setVerDisp] = useState(null);

  const cargar = async () => {
    const { data, error } = await supabaseClient
      .from("club_profesor")
      .select("*, usuarios:profesor_id(nombre, telefono, email)")
      .eq("club_id", club.id)
      .order("invitado_en", { ascending: false });
    if (error) { console.error(error); return; }
    setVinculos(data || []);
  };

  useEffect(() => { cargar(); }, [club.id]);

  const crearInvitacion = async (nombre, telefono) => {
    const token = crypto.randomUUID();
    const { error } = await supabaseClient.from("club_profesor").insert({
      club_id: club.id,
      nombre_invitado: nombre,
      telefono_invitado: telefono,
      token_invitacion: token,
      estado: "invitado",
    });
    if (error) { console.error(error); showToast("No se pudo crear la invitación"); return null; }
    await cargar();
    return token;
  };

  const guardarPlantilla = async (texto) => {
    const { data, error } = await supabaseClient.from("clubes").update({ plantilla_invitacion: texto }).eq("id", club.id).select();
    if (error) { console.error(error); return; }
    onClubUpdate(data[0]);
    setShowPlantilla(false);
    showToast("Mensaje actualizado");
  };

  if (vinculos === null) {
    return <div style={{ padding: 32, textAlign: "center", color: COLORS.inkSoft }}>Cargando...</div>;
  }

  return (
    <div style={{ padding: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div style={{ fontWeight: 800, fontSize: 18 }}>Profes ({vinculos.length})</div>
        <button onClick={() => setShowPlantilla(true)} title="Editar mensaje de invitación" style={{ background: COLORS.clayLight, border: "none", color: COLORS.ink, width: 30, height: 30, borderRadius: "50%", cursor: "pointer" }}>
          <Pencil size={14} />
        </button>
      </div>
      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 14 }}>
        Invitá a un profe por WhatsApp, tenga cuenta en CourtClass o no.
      </div>

      {vinculos.length === 0 && <div style={{ color: COLORS.inkSoft, fontSize: 14, marginBottom: 16 }}>Todavía no invitaste a ningún profe.</div>}

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {vinculos.map((v) => {
          const nombre = (v.usuarios && v.usuarios.nombre) || v.nombre_invitado || "Sin nombre";
          const telefono = (v.usuarios && v.usuarios.telefono) || v.telefono_invitado;
          const activo = v.estado === "activo";
          return (
            <div key={v.id} style={cardStyle}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>{nombre}</div>
                  {telefono && <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>{telefono}</div>}
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 12, color: activo ? "#fff" : COLORS.ink, background: activo ? COLORS.disponible : COLORS.line }}>
                  {activo ? "Activo" : "Invitado"}
                </span>
              </div>
              {activo && (
                <button onClick={() => setVerDisp({ id: v.profesor_id, nombre })} style={{ ...pillBtn, background: "transparent", color: COLORS.court, border: `1px solid ${COLORS.court}`, marginTop: 10 }}>
                  <Clock size={12} /> Ver disponibilidad
                </button>
              )}
              {!activo && telefono && (
                <a
                  href={linkWhatsApp(telefono, armarMensajeWa(club.plantilla_invitacion || "Hola {nombre}! Te invito a sumarte a CourtClass. Sumate acá: {link}", { nombre: nombre.split(" ")[0], link: `${window.location.origin}${window.location.pathname}?invitacion=${v.token_invitacion}` }))}
                  target="_blank"
                  rel="noreferrer"
                  style={{ ...pillBtn, background: "#25D366", color: "#fff", border: "none", textDecoration: "none", marginTop: 10, display: "inline-flex" }}
                >
                  <MessageCircle size={12} /> Reenviar invitación
                </a>
              )}
            </div>
          );
        })}
      </div>

      <button onClick={() => setShowInvitar(true)} style={fabStyle}>
        <Plus size={24} color="#fff" />
      </button>

      {showInvitar && (
        <AddInvitacionModal club={club} onClose={() => setShowInvitar(false)} onCrear={crearInvitacion} />
      )}
      {showPlantilla && (
        <EditarPlantillaInvitacionModal plantilla={club.plantilla_invitacion} onClose={() => setShowPlantilla(false)} onSave={guardarPlantilla} />
      )}
      {verDisp && (
        <VerDisponibilidadModal profesorId={verDisp.id} nombre={verDisp.nombre} onClose={() => setVerDisp(null)} />
      )}
    </div>
  );
}

function VerDisponibilidadModal({ profesorId, nombre, onClose }) {
  const [disponibilidad, setDisponibilidad] = useState(null);

  useEffect(() => {
    supabaseClient.from("disponibilidad").select("*").eq("profesor_id", profesorId).eq("tipo", "patron").then(({ data }) => setDisponibilidad(data || []));
  }, [profesorId]);

  const disponibleEn = (dia, hora) => {
    if (!disponibilidad) return false;
    return disponibilidad.some((d) => d.dia_semana === dia && Number(d.hora_inicio.slice(0, 2)) <= hora && Number(d.hora_fin.slice(0, 2)) > hora && d.disponible);
  };

  return (
    <ModalShell title={`Disponibilidad de ${nombre}`} onClose={onClose}>
      {disponibilidad === null ? (
        <div style={{ textAlign: "center", color: COLORS.inkSoft, padding: 20 }}>Cargando...</div>
      ) : disponibilidad.length === 0 ? (
        <div style={{ color: COLORS.inkSoft, fontSize: 14 }}>Este profe todavía no cargó su disponibilidad.</div>
      ) : (
        <div style={{ overflowX: "auto" }}>
          <div style={{ display: "grid", gridTemplateColumns: "44px repeat(7, 1fr)", gap: 3, minWidth: 460 }}>
            <div />
            {DIAS_CORTO.map((d) => (
              <div key={d} style={{ fontSize: 10.5, fontWeight: 800, textAlign: "center", padding: "6px 2px", color: COLORS.inkSoft }}>{d}</div>
            ))}
            {HORAS_CLUB.map((hora) => (
              <React.Fragment key={hora}>
                <div style={{ fontSize: 10.5, color: COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: 4 }}>
                  {String(hora).padStart(2, "0")}
                </div>
                {DIAS_CORTO.map((_, dia) => (
                  <div key={dia} style={{ height: 22, borderRadius: 4, background: disponibleEn(dia, hora) ? COLORS.disponible : "#fff", boxShadow: disponibleEn(dia, hora) ? "none" : `inset 0 0 0 1px ${COLORS.line}` }} />
                ))}
              </React.Fragment>
            ))}
          </div>
        </div>
      )}
    </ModalShell>
  );
}
