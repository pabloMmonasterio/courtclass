const HORAS_CLUB = Array.from({ length: 15 }, (_, i) => i + 8); // 8:00 a 22:00

function ClubAgendaView({ club, showToast }) {
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [clases, setClases] = useState(null);
  const [profesores, setProfesores] = useState([]);
  const [showAddClase, setShowAddClase] = useState(false);
  const [filtroProfe, setFiltroProfe] = useState("todos");
  const [reprogramando, setReprogramando] = useState(null);
  const [cancelando, setCancelando] = useState(null);

  const cargarClases = async () => {
    const { data, error } = await supabaseClient
      .from("clases")
      .select("*, clase_alumnos(alumnos(id, nombre, telefono))")
      .eq("club_id", club.id)
      .order("fecha", { ascending: true });
    if (error) { console.error(error); return; }
    setClases(data || []);
  };

  const cargarProfesores = async () => {
    const { data, error } = await supabaseClient
      .from("club_profesor")
      .select("*, usuarios:profesor_id(id, nombre, telefono)")
      .eq("club_id", club.id)
      .eq("estado", "activo");
    if (error) { console.error(error); return; }
    setProfesores(data || []);
  };

  useEffect(() => { cargarClases(); cargarProfesores(); }, [club.id]);

  const marcarHecha = async (clase) => {
    const { error } = await supabaseClient.from("clases").update({ estado: clase.estado === "hecha" ? "pendiente" : "hecha" }).eq("id", clase.id);
    if (error) { console.error(error); return; }
    cargarClases();
  };

  if (clases === null) {
    return <div style={{ padding: 32, textAlign: "center", color: COLORS.inkSoft }}>Cargando...</div>;
  }

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });

  const clasesFiltradas = clases.filter((c) => filtroProfe === "todos" || c.profesor_id === filtroProfe);

  const clasesByDay = days.map((d) => {
    const key = toISODateLocal(d);
    return clasesFiltradas.filter((c) => c.fecha === key).sort((a, b) => a.hora_inicio.localeCompare(b.hora_inicio));
  });

  if (profesores.length === 0) {
    return (
      <div style={{ padding: 32, textAlign: "center" }}>
        <div style={{ fontSize: 15, color: COLORS.inkSoft, fontWeight: 600 }}>Todavía no tenés profes activos</div>
        <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginTop: 6 }}>Invitá a un profe desde la pestaña "Profes" para poder asignarle clases.</div>
      </div>
    );
  }

  return (
    <div style={{ padding: "16px 16px 0" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate() - 7); setWeekStart(d); }} style={navBtnStyle}>
          <ChevronLeft size={18} />
        </button>
        <div style={{ fontWeight: 700, fontSize: 14 }}>{fmtDateShort(days[0])} – {fmtDateShort(days[6])}</div>
        <button onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate() + 7); setWeekStart(d); }} style={navBtnStyle}>
          <ChevronRight size={18} />
        </button>
      </div>

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
        <button onClick={() => setFiltroProfe("todos")} style={{ ...chipStyle, background: filtroProfe === "todos" ? COLORS.ink : "#fff", color: filtroProfe === "todos" ? "#fff" : COLORS.ink, borderColor: filtroProfe === "todos" ? COLORS.ink : COLORS.line }}>
          Todos
        </button>
        {profesores.map((p) => {
          const nombre = (p.usuarios && p.usuarios.nombre) || p.nombre_invitado || "Profe";
          return (
            <button key={p.profesor_id} onClick={() => setFiltroProfe(p.profesor_id)} style={{ ...chipStyle, background: filtroProfe === p.profesor_id ? COLORS.court : "#fff", color: filtroProfe === p.profesor_id ? "#fff" : COLORS.ink, borderColor: filtroProfe === p.profesor_id ? COLORS.court : COLORS.line }}>
              {nombre}
            </button>
          );
        })}
      </div>

      <div className="week-grid">
        {days.map((d, i) => {
          const key = toISODateLocal(d);
          const clasesDia = clasesByDay[i];
          const isToday = key === toISODateLocal(new Date());
          return (
            <div key={key} style={{ marginBottom: 18 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, color: isToday ? COLORS.clay : COLORS.inkSoft }}>{DIAS_CORTO[d.getDay()]}</span>
                <span style={{ fontSize: 12, color: COLORS.inkSoft }}>{fmtDateShort(d)}</span>
                {isToday && <span style={{ fontSize: 10, background: COLORS.clay, color: "#fff", padding: "1px 7px", borderRadius: 10, fontWeight: 700 }}>HOY</span>}
              </div>
              {clasesDia.length === 0 ? (
                <div style={{ fontSize: 13, color: COLORS.inkSoft, paddingLeft: 2 }}>Sin clases</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {clasesDia.map((c) => {
                    const profe = profesores.find((p) => p.profesor_id === c.profesor_id);
                    const nombreProfe = (profe && profe.usuarios && profe.usuarios.nombre) || profe?.nombre_invitado || "Profe";
                    const alumnosNombres = (c.clase_alumnos || []).map((ca) => ca.alumnos?.nombre).filter(Boolean);
                    const cancelada = c.estado === "cancelada";
                    const hecha = c.estado === "hecha";
                    return (
                      <div key={c.id} style={{ ...cardStyle, opacity: cancelada ? 0.6 : 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", gap: 6 }}>
                          <Clock size={14} color={COLORS.court} />
                          <span style={{ textDecoration: cancelada ? "line-through" : "none" }}>{c.hora_inicio.slice(0, 5)} - {c.hora_fin.slice(0, 5)}</span>
                        </div>
                        <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginTop: 2 }}>
                          {alumnosNombres.join(", ") || "Sin alumno"}
                        </div>
                        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2, display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                          <span style={{ fontSize: 10.5, fontWeight: 700, color: "#fff", background: COLORS.court, padding: "1px 7px", borderRadius: 8 }}><div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2, display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                          <span style={{ fontSize: 10.5, fontWeight: 700, color: "#fff", background: COLORS.court, padding: "1px 7px", borderRadius: 8 }}>{nombreProfe}</span>
                          {c.precio != null && <span style={{ fontWeight: 700 }}>{fmtMoney(c.precio)}</span>}
                        </div>
                        {c.reprogramada_desde_fecha_anterior && null}
                        {c.motivo_reprogramacion && !cancelada && (
                          <div style={{ fontSize: 11.5, color: COLORS.clay, marginTop: 4, fontWeight: 600 }}>
                            <CloudRain size={12} /> Reprogramada · {c.motivo_reprogramacion}
                          </div>
                        )}
                        {cancelada && (
                          <div style={{ fontSize: 11.5, color: "#B23A3A", marginTop: 4, fontWeight: 700 }}>
                            Cancelada{c.motivo_cancelacion ? ` · ${c.motivo_cancelacion}` : ""}{c.con_aviso != null ? (c.con_aviso ? " · con aviso" : " · sin aviso") : ""}
                          </div>
                        )}
                        {!cancelada && (
                          <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                            <button onClick={() => marcarHecha(c)} style={{ ...pillBtn, background: hecha ? COLORS.court : "transparent", color: hecha ? "#fff" : COLORS.court, border: `1px solid ${COLORS.court}` }}>
                              <Check size={12} /> {hecha ? "Hecha" : "Marcar hecha"}
                            </button>
                            <button onClick={() => setReprogramando(c)} style={{ ...pillBtn, background: "transparent", color: COLORS.clay, border: `1px solid ${COLORS.clay}` }}>
                              <CloudRain size={12} /> Reprogramar
                            </button>
                            <button onClick={() => setCancelando(c)} style={{ ...pillBtn, background: "transparent", color: "#B23A3A", border: "1px solid #B23A3A" }}>
                              Cancelar
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <button onClick={() => setShowAddClase(true)} style={fabStyle}>
        <Plus size={24} color="#fff" />
      </button>

      {showAddClase && (
        <AddClaseClubModal
          club={club}
          profesores={profesores}
          onClose={() => setShowAddClase(false)}
          onGuardado={() => { cargarClases(); showToast("Clase asignada"); }}
        />
      )}
      {reprogramando && (
        <ReprogramarClaseClubModal
          clase={reprogramando}
          club={club}
          profesores={profesores}
          onClose={() => setReprogramando(null)}
          onGuardado={() => { setReprogramando(null); cargarClases(); showToast("Clase reprogramada"); }}
        />
      )}
      {cancelando && (
        <CancelarClaseClubModal
          clase={cancelando}
          club={club}
          profesores={profesores}
          onClose={() => setCancelando(null)}
          onGuardado={() => { setCancelando(null); cargarClases(); showToast("Clase cancelada"); }}
        />
      )}
    </div>
  );
}

function ReprogramarClaseClubModal({ clase, club, profesores, onClose, onGuardado }) {
  const [fecha, setFecha] = useState(clase.fecha);
  const [hora, setHora] = useState(clase.hora_inicio.slice(0, 5));
  const [motivo, setMotivo] = useState("Lluvia");
  const [guardando, setGuardando] = useState(false);
  const [guardado, setGuardado] = useState(false);

  const duracionMin = (() => {
    const [h1, m1] = clase.hora_inicio.split(":").map(Number);
    const [h2, m2] = clase.hora_fin.split(":").map(Number);
    return h2 * 60 + m2 - (h1 * 60 + m1);
  })();
  const horaFin = addMinutos(hora, duracionMin);

  const profe = profesores.find((p) => p.profesor_id === clase.profesor_id);
  const profeNombre = (profe && profe.usuarios && profe.usuarios.nombre) || (profe && profe.nombre_invitado) || "Profe";
  const profeTelefono = (profe && profe.usuarios && profe.usuarios.telefono) || (profe && profe.telefono_invitado);
  const alumnos = (clase.clase_alumnos || []).map((ca) => ca.alumnos).filter(Boolean);

  const guardar = async () => {
    setGuardando(true);
    const { error } = await supabaseClient
      .from("clases")
      .update({
        fecha,
        hora_inicio: hora,
        hora_fin: horaFin,
        motivo_reprogramacion: motivo,
        fecha_anterior: clase.fecha,
        hora_inicio_anterior: clase.hora_inicio,
      })
      .eq("id", clase.id);
    setGuardando(false);
    if (error) { console.error(error); return; }
    setGuardado(true);
    onGuardado();
  };

  if (guardado) {
    const mensajeAlumno = `Hola! Te reprogramamos tu clase en ${club.nombre} de ${fmtFechaHoraLarga(clase.fecha, clase.hora_inicio.slice(0, 5))} para el ${fmtFechaHoraLarga(fecha, hora)} (${motivo.toLowerCase()}).`;
    const mensajeProfe = `Hola ${profeNombre.split(" ")[0]}! Se reprogramó tu clase en ${club.nombre} de ${fmtFechaHoraLarga(clase.fecha, clase.hora_inicio.slice(0, 5))} para el ${fmtFechaHoraLarga(fecha, hora)} (${motivo.toLowerCase()}).`;
    return (
      <ModalShell title="Clase reprogramada" onClose={onClose}>
        <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginBottom: 14 }}>Avisale a cada uno por WhatsApp si querés:</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {alumnos.filter((a) => a.telefono).map((a) => (
            <a key={a.id} href={linkWhatsApp(a.telefono, mensajeAlumno)} target="_blank" rel="noreferrer" style={{ ...primaryBtn, background: "#25D366", textDecoration: "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <MessageCircle size={16} /> Avisar a {a.nombre.split(" ")[0]}
            </a>
          ))}
          {profeTelefono && (
            <a href={linkWhatsApp(profeTelefono, mensajeProfe)} target="_blank" rel="noreferrer" style={{ ...primaryBtn, background: "#25D366", textDecoration: "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <MessageCircle size={16} /> Avisar a {profeNombre.split(" ")[0]}
            </a>
          )}
          <button onClick={onClose} style={{ ...primaryBtn, background: "#fff", color: COLORS.ink, border: `1px solid ${COLORS.line}` }}>Listo</button>
        </div>
      </ModalShell>
    );
  }

  return (
    <ModalShell title="Reprogramar clase" onClose={onClose}>
      <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginBottom: 14 }}>
        Originalmente {fmtFechaHoraLarga(clase.fecha, clase.hora_inicio.slice(0, 5))}
      </div>
      <Label>Motivo</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
        {["Lluvia", "Alumno", "Profe", "Otro"].map((m) => (
          <button key={m} onClick={() => setMotivo(m)} style={{ ...chipStyle, background: motivo === m ? COLORS.clay : "#fff", color: motivo === m ? "#fff" : COLORS.ink, borderColor: motivo === m ? COLORS.clay : COLORS.line }}>
            {m}
          </button>
        ))}
      </div>
      <Label>Nueva fecha</Label>
      <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />
      <Label>Nuevo horario</Label>
      <input type="time" value={hora} onChange={(e) => setHora(e.target.value)} style={{ ...inputStyle, marginBottom: 18 }} />
      <button disabled={guardando} onClick={guardar} style={primaryBtn}>
        {guardando ? "Guardando..." : "Confirmar reprogramación"}
      </button>
    </ModalShell>
  );
}

function CancelarClaseClubModal({ clase, club, profesores, onClose, onGuardado }) {
  const [motivo, setMotivo] = useState("Alumno");
  const [conAviso, setConAviso] = useState(true);
  const [cobrarIgual, setCobrarIgual] = useState(false);
  const [guardando, setGuardando] = useState(false);
  const [guardado, setGuardado] = useState(false);

  const profe = profesores.find((p) => p.profesor_id === clase.profesor_id);
  const profeNombre = (profe && profe.usuarios && profe.usuarios.nombre) || (profe && profe.nombre_invitado) || "Profe";
  const profeTelefono = (profe && profe.usuarios && profe.usuarios.telefono) || (profe && profe.telefono_invitado);
  const alumnos = (clase.clase_alumnos || []).map((ca) => ca.alumnos).filter(Boolean);

  const guardar = async () => {
    setGuardando(true);
    const { error } = await supabaseClient
      .from("clases")

    const mensajeProfe = `Hola ${profeNombre.split(" ")[0]}! Se cancela tu clase en ${club.nombre} del ${fmtFechaHoraLarga(clase.fecha, clase.hora_inicio.slice(0, 5))} (${motivo.toLowerCase()}).`;

          {profeTelefono && (

              <MessageCircle size={16} /> Avisar a {profeNombre.split(" ")[0]}
            </a>
          )}
          <button onClick={onClose} style={{ ...primaryBtn, background: "#fff", color: COLORS.ink, border: `1px solid ${COLORS.line}` }}>Listo</button>
        </div>
      </ModalShell>
    );
  }

  return (
    <ModalShell title="Cancelar clase" onClose={onClose}>
      <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginBottom: 14 }}>
        {fmtFechaHoraLarga(clase.fecha, clase.hora_inicio.slice(0, 5))}
      </div>
      <Label>¿Quién cancela?</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {["Alumno", "Profe", "Clima", "Otro"].map((m) => (
          <button key={m} onClick={() => setMotivo(m)} style={{ ...chipStyle, background: motivo === m ? "#B23A3A" : "#fff", color: motivo === m ? "#fff" : COLORS.ink, borderColor: motivo === m ? "#B23A3A" : COLORS.line }}>
            {m}
          </button>
        ))}
      </div>
      <Label>¿Avisó con tiempo suficiente?</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        <button onClick={() => setConAviso(true)} style={{ ...chipStyle, background: conAviso ? COLORS.court : "#fff", color: conAviso ? "#fff" : COLORS.ink, borderColor: conAviso ? COLORS.court : COLORS.line }}>

        <button onClick={() => setConAviso(false)} style={{ ...chipStyle, background: !conAviso ? "#B23A3A" : "#fff", color: !conAviso ? "#fff" : COLORS.ink, borderColor: !conAviso ? "#B23A3A" : COLORS.line }}>

        >
          <div style={{ width: 18, height: 18, borderRadius: 5, border: `2px solid ${cobrarIgual ? "#B23A3A" : COLORS.inkSoft}`, background: cobrarIgual ? "#B23A3A" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>

            <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Queda marcada para que la resuelvas con el alumno.</div>
          </div>
        </div>
      )}
      <button disabled={guardando} onClick={guardar} style={{ ...primaryBtn, background: "#B23A3A" }}>
        {guardando ? "Guardando..." : "Confirmar cancelación"}
      </button>
    </ModalShell>
  );

  const [hora, setHora] = useState("09:00");
  const [duracionMin, setDuracionMin] = useState(60);
  const [disponibilidadProfe, setDisponibilidadProfe] = useState(null);
  const [clasesProfe, setClasesProfe] = useState([]);
  const [guardando, setGuardando] = useState(false);
  const [claseCreada, setClaseCreada] = useState(null);

  useEffect(() => {
    supabaseClient.from("alumnos").select("*").eq("club_id", club.id).then(({ data }) => setAlumnos(data || []));
  }, [club.id]);

  useEffect(() => {
    if (!profesorId) return;
    supabaseClient.from("disponibilidad").select("*").eq("profesor_id", profesorId).eq("tipo", "patron").then(({ data }) => setDisponibilidadProfe(data || []));
    supabaseClient.from("clases").select("fecha, hora_inicio, hora_fin").eq("profesor_id", profesorId).neq("estado", "cancelada").then(({ data }) => setClasesProfe(data || []));
  }, [profesorId]);

  const diaSemana = new Date(fecha + "T00:00:00").getDay();
  const disponibleEnHora = (h) => {
    if (!disponibilidadProfe) return false;
    return disponibilidadProfe.some((d) => d.dia_semana === diaSemana && Number(d.hora_inicio.slice(0, 2)) <= h && Number(d.hora_fin.slice(0, 2)) > h && d.disponible);
  };

  const horaFin = addMinutos(hora, duracionMin);
  const superpuesta = clasesProfe.find((c) => c.fecha === fecha && rangosSuperponen(hora, horaFin, c.hora_inicio.slice(0, 5), c.hora_fin.slice(0, 5)));

  const alumnosFiltrados = busqueda.trim().length === 0 ? [] : alumnos.filter((a) => a.nombre.toLowerCase().includes(busqueda.trim().toLowerCase()));
  const yaExisteExacto = alumnos.some((a) => a.nombre.toLowerCase() === busqueda.trim().toLowerCase());

  const maxAlumnos = TIPOS_CLASE.find((t) => t.id === tipoClase).max;
  const cantidadExtras = maxAlumnos - 1;

  const puedeGuardar = profesorId && (alumnoSel || busqueda.trim()) && fecha && hora;

  const guardar = async () => {
    setGuardando(true);
    let alumnoId = alumnoSel?.id;
    let alumnoNombre = alumnoSel?.nombre;
    let alumnoTelefono = alumnoSel?.telefono;
    if (!alumnoId) {
      const { data: nuevo, error: errorAlumno } = await supabaseClient
        .from("alumnos")
        .insert({ club_id: club.id, nombre: busqueda.trim(), telefono: telefonoNuevo.trim() })
        .select();
      if (errorAlumno) { console.error(errorAlumno); setGuardando(false); return; }
      alumnoId = nuevo[0].id;
      alumnoNombre = nuevo[0].nombre;
      alumnoTelefono = nuevo[0].telefono;
    }

    const { data: clase, error: errorClase } = await supabaseClient
      .from("clases")
      .insert({ club_id: club.id, profesor_id: profesorId, fecha, hora_inicio: hora, hora_fin: horaFin, estado: "pendiente", precio: precio ? Number(precio) : null })
      .select();
    if (errorClase) { console.error(errorClase); setGuardando(false); return; }

    await supabaseClient.from("clase_alumnos").insert({ clase_id: clase[0].id, alumno_id: alumnoId });

    const nombresExtras = [];
    for (let i = 0; i < cantidadExtras; i++) {
      const nombreExtra = (extraNombres[i] || "").trim();
      if (!nombreExtra) continue;
      const { data: nuevoExtra, error: errorExtra } = await supabaseClient
        .from("alumnos")
        .insert({ club_id: club.id, nombre: nombreExtra })
        .select();
      if (errorExtra) { console.error(errorExtra); continue; }
      await supabaseClient.from("clase_alumnos").insert({ clase_id: clase[0].id, alumno_id: nuevoExtra[0].id });
      nombresExtras.push(nombreExtra);
    }

    setGuardando(false);
    const profe = profesores.find((p) => p.profesor_id === profesorId);
    const profeNombre = (profe && profe.usuarios && profe.usuarios.nombre) || (profe && profe.nombre_invitado) || "Profe";
    const profeTelefono = (profe && profe.usuarios && profe.usuarios.telefono) || (profe && profe.telefono_invitado);
    setClaseCreada({ alumnoNombre, alumnoTelefono, nombresExtras, profeNombre, profeTelefono, fecha, hora });
    onGuardado();
  };

  if (claseCreada) {
    const todosNombres = [claseCreada.alumnoNombre, ...claseCreada.nombresExtras].join(", ");
    const mensajeAlumno = `Hola ${claseCreada.alumnoNombre.split(" ")[0]}! Te confirmamos tu clase en ${club.nombre} el ${fmtFechaHoraLarga(claseCreada.fecha, claseCreada.hora)} con el profe ${claseCreada.profeNombre}.`;
    const mensajeProfe = `Hola ${claseCreada.profeNombre.split(" ")[0]}! Te asignaron una clase en ${club.nombre} el ${fmtFechaHoraLarga(claseCreada.fecha, claseCreada.hora)} con ${todosNombres}.`;
    return (
      <ModalShell title="Clase asignada" onClose={onClose}>
        <div style={{ fontSize: 13.5, color: COLORS.inkSoft, marginBottom: 14 }}>
          Listo. Avisale a cada uno por WhatsApp si querés:
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {claseCreada.alumnoTelefono && (
            <a href={linkWhatsApp(claseCreada.alumnoTelefono, mensajeAlumno)} target="_blank" rel="noreferrer" style={{ ...primaryBtn, background: "#25D366", textDecoration: "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <MessageCircle size={16} /> Avisar a {claseCreada.alumnoNombre.split(" ")[0]}
            </a>
          )}
          {claseCreada.profeTelefono && (
            <a href={linkWhatsApp(claseCreada.profeTelefono, mensajeProfe)} target="_blank" rel="noreferrer" style={{ ...primaryBtn, background: "#25D366", textDecoration: "none", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <MessageCircle size={16} /> Avisar a {claseCreada.profeNombre.split(" ")[0]}
            </a>
          )}
          <button onClick={onClose} style={{ ...primaryBtn, background: "#fff", color: COLORS.ink, border: `1px solid ${COLORS.line}` }}>Listo</button>
        </div>
      </ModalShell>
    );
  }

  return (
    <ModalShell title="Nueva clase" onClose={onClose}>
      <Label>Profe</Label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
        {profesores.map((p) => {
          const nombre = (p.usuarios && p.usuarios.nombre) || p.nombre_invitado || "Profe";
          return (
            <button key={p.profesor_id} onClick={() => setProfesorId(p.profesor_id)} style={{ ...chipStyle, background: profesorId === p.profesor_id ? COLORS.court : "#fff", color: profesorId === p.profesor_id ? "#fff" : COLORS.ink, borderColor: profesorId === p.profesor_id ? COLORS.court : COLORS.line }}>
              {nombre}
            </button>
          );
        })}
      </div>

      <Label>Tipo de clase</Label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
        {TIPOS_CLASE.map((t) => (
          <button key={t.id} onClick={() => setTipoClase(t.id)} style={{ ...chipStyle, background: tipoClase === t.id ? COLORS.court : "#fff", color: tipoClase === t.id ? "#fff" : COLORS.ink, borderColor: tipoClase === t.id ? COLORS.court : COLORS.line }}>
            {t.label}
          </button>
        ))}
      </div>

      <Label>Alumno responsable</Label>
      {alumnoSel ? (
        <button onClick={() => setAlumnoSel(null)} style={{ ...chipStyle, background: COLORS.court, color: "#fff", borderColor: COLORS.court, marginBottom: 12, display: "flex", alignItems: "center", gap: 5 }}>
          {alumnoSel.nombre} <span style={{ fontWeight: 900 }}>✕</span>
        </button>
      ) : (
        <div style={{ position: "relative", marginBottom: 6 }}>
          <input value={busqueda} onChange={(e) => { setBusqueda(e.target.value); setMostrarLista(true); }} onFocus={() => setMostrarLista(true)} placeholder="🔍 Buscar alumno..." style={inputStyle} />
          {mostrarLista && busqueda.trim().length > 0 && (
            <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, marginTop: 4, maxHeight: 200, overflowY: "auto", zIndex: 10, boxShadow: "0 8px 20px rgba(0,0,0,0.12)" }}>
              {alumnosFiltrados.map((a) => (
                <button key={a.id} onClick={() => { setAlumnoSel(a); setBusqueda(""); setMostrarLista(false); }} style={{ display: "block", width: "100%", textAlign: "left", padding: "10px 12px", border: "none", background: "none", borderBottom: `1px solid ${COLORS.line}`, cursor: "pointer", fontSize: 14 }}>
                  {a.nombre}
                </button>
              ))}
              {!yaExisteExacto && (
                <div style={{ padding: 12 }}>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 6 }}>No encontrado. Se va a cargar "{busqueda.trim()}" como alumno nuevo:</div>
                  <input value={telefonoNuevo} onChange={(e) => setTelefonoNuevo(e.target.value)} placeholder="Teléfono (opcional)" style={{ ...inputStyle, fontSize: 13, padding: "8px 10px" }} />
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {cantidadExtras > 0 && (
        <>
          <Label>Otros alumnos (opcional)</Label>
          {Array.from({ length: cantidadExtras }).map((_, i) => (
            <input
              key={i}
              value={extraNombres[i] || ""}
              onChange={(e) => setExtraNombres((prev) => { const next = [...prev]; next[i] = e.target.value; return next; })}
              placeholder={`Nombre del alumno ${i + 2}`}
              style={{ ...inputStyle, marginBottom: 8 }}
            />
          ))}
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 12 }}>No hace falta completarlos todos si todavía no sabés los nombres.</div>
        </>
      )}

      <Label>Fecha</Label>
      <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} />

      <Label>Horario</Label>
      <input type="time" value={hora} onChange={(e) => setHora(e.target.value)} style={{ ...inputStyle, marginBottom: 6 }} />
      {disponibilidadProfe && (
        <div style={{ fontSize: 12, marginBottom: 12, fontWeight: 600, color: disponibleEnHora(Number(hora.slice(0, 2))) ? COLORS.disponible : "#B23A3A" }}>
          {disponibleEnHora(Number(hora.slice(0, 2))) ? "✓ El profe marcó este horario como disponible" : "⚠ El profe no marcó este horario como disponible"}
        </div>
      )}

      <Label>Duración</Label>
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[{ label: "1 h", min: 60 }, { label: "1:30 h", min: 90 }, { label: "2 h", min: 120 }, { label: "2:30 h", min: 150 }].map((opt) => (
          <button key={opt.min} onClick={() => setDuracionMin(opt.min)} style={{ ...chipStyle, background: duracionMin === opt.min ? COLORS.court : "#fff", color: duracionMin === opt.min ? "#fff" : COLORS.ink, borderColor: duracionMin === opt.min ? COLORS.court : COLORS.line }}>
            {opt.label}
          </button>
        ))}
      </div>

      <Label>Precio total de la clase (opcional)</Label>
      <input type="number" inputMode="numeric" value={precio} onChange={(e) => setPrecio(e.target.value)} placeholder="Ej: 8000" style={{ ...inputStyle, marginBottom: 18 }} />

      {superpuesta && (
        <div style={{ background: "#FBE4E4", border: "1.5px solid #B23A3A", borderRadius: 10, padding: "10px 12px", marginBottom: 12, fontSize: 13, color: "#8A2A2A", fontWeight: 700 }}>
          ⚠ Ese profe ya tiene una clase de {superpuesta.hora_inicio.slice(0, 5)} a {superpuesta.hora_fin.slice(0, 5)} ese día.
        </div>
      )}

      <button disabled={!puedeGuardar || guardando} onClick={guardar} style={{ ...primaryBtn, background: superpuesta ? "#B23A3A" : primaryBtn.background, opacity: puedeGuardar ? 1 : 0.5 }}>
        {guardando ? "Guardando..." : superpuesta ? "Guardar de todos modos (se pisa)" : "Asignar clase"}
      </button>
    </ModalShell>
  );
}
 function MisClubesSection({ userId }) {
  const [clubes, setClubes] = useState(null);

  useEffect(() => {
    supabaseClient
      .from("club_profesor")
      .select("*, clubes(nombre)")
      .eq("profesor_id", userId)
      .eq("estado", "activo")
      .then(({ data }) => setClubes(data || []));
  }, [userId]);

  if (clubes === null || clubes.length === 0) return null;

  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.inkSoft, textTransform: "uppercase", marginBottom: 6 }}>Clubes en los que trabajás</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {clubes.map((c) => (
          <div key={c.id} style={{ ...cardStyle, padding: "10px 14px" }}>
            <div style={{ fontWeight: 700, fontSize: 14 }}>{c.clubes && c.clubes.nombre}</div>
            <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 2 }}>
              {c.permiso_cancelar ? "Podés cancelar/reprogramar tus clases de este club" : "El club maneja tus cancelaciones/reprogramaciones"}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
 function ClubAlumnosView({ club, showToast }) {
  const [alumnos, setAlumnos] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [editando, setEditando] = useState(null);

  const cargar = async () => {
    const { data, error } = await supabaseClient.from("alumnos").select("*").eq("club_id", club.id).order("nombre");
    if (error) { console.error(error); return; }
    setAlumnos(data || []);
  };

  useEffect(() => { cargar(); }, [club.id]);

  const guardar = async (form) => {
    if (editando) {
      const { error } = await supabaseClient.from("alumnos").update({ nombre: form.nombre, telefono: form.telefono }).eq("id", editando.id);
      if (error) { console.error(error); return; }
      showToast("Alumno actualizado");
    } else {
      const { error } = await supabaseClient.from("alumnos").insert({ club_id: club.id, nombre: form.nombre, telefono: form.telefono });
      if (error) { console.error(error); return; }
      showToast("Alumno agregado");
    }
    setShowAdd(false);
    setEditando(null);
    cargar();
  };

  const eliminar = async (id) => {
    const { error } = await supabaseClient.from("alumnos").delete().eq("id", id);
    if (error) { console.error(error); return; }
    cargar();
  };

  if (alumnos === null) {
    return <div style={{ padding: 32, textAlign: "center", color: COLORS.inkSoft }}>Cargando...</div>;
  }

  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 12 }}>Alumnos ({alumnos.length})</div>
      {alumnos.length === 0 && <div style={{ color: COLORS.inkSoft, fontSize: 14, marginBottom: 16 }}>Todavía no cargaste alumnos.</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {alumnos.map((a) => (
          <div key={a.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{a.nombre}</div>
              {a.telefono && <div style={{ fontSize: 13, color: COLORS.inkSoft }}>{a.telefono}</div>}
            </div>
            <div style={{ display: "flex", gap: 4 }}>
              <button onClick={() => setEditando(a)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", padding: 6 }}>
                <Pencil size={16} />
              </button>
              <button onClick={() => eliminar(a.id)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", padding: 6 }}>
                <Trash2 size={16} />
              </button>
            </div>
          </div>
        ))}
      </div>
      <button onClick={() => setShowAdd(true)} style={fabStyle}>
        <Plus size={24} color="#fff" />
      </button>
      {(showAdd || editando) && (
        <AddAlumnoClubModal alumno={editando} onClose={() => { setShowAdd(false); setEditando(null); }} onSave={guardar} />
      )}
    </div>
  );
}

function AddAlumnoClubModal({ alumno, onClose, onSave }) {
  const [nombre, setNombre] = useState(alumno?.nombre || "");
  const [telefono, setTelefono] = useState(alumno?.telefono || "");
  return (
    <ModalShell title={alumno ? "Editar alumno" : "Nuevo alumno"} onClose={onClose}>
      <Label>Nombre</Label>
      <input value={nombre} onChange={(e) => setNombre(e.target.value)} style={{ ...inputStyle, marginBottom: 12 }} placeholder="Nombre y apellido" />
      <Label>Teléfono</Label>
      <input value={telefono} onChange={(e) => setTelefono(e.target.value)} style={{ ...inputStyle, marginBottom: 18 }} placeholder="Teléfono o WhatsApp" />
      <button disabled={!nombre.trim()} onClick={() => onSave({ nombre: nombre.trim(), telefono: telefono.trim() })} style={{ ...primaryBtn, opacity: nombre.trim() ? 1 : 0.4 }}>
        {alumno ? "Guardar cambios" : "Guardar alumno"}
      </button>
    </ModalShell>
  );
}
 function RoleGateScreen({ onElegir }) {
  return (
    <div style={{ minHeight: "100vh", background: "#B85C2E", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, width: "100%", maxWidth: 380, textAlign: "center" }}>
        <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 20, color: COLORS.ink }}>¿Cómo vas a usar CourtClass?</div>
        <button onClick={() => onElegir("profe")} style={{ ...primaryBtn, marginBottom: 12 }}>Soy Profe</button>
        <button onClick={() => onElegir("club")} style={{ ...primaryBtn, background: "#fff", color: COLORS.court, border: `1.5px solid ${COLORS.court}` }}>Soy Club</button>
      </div>
    </div>
  );
}
 function Root() {
  const [session, setSession] = useState(undefined);
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [showAccount, setShowAccount] = useState(false);
  const [perfil, setPerfil] = useState(undefined); // undefined = sin resolver, null = todavía sin fila
  const [rolElegido, setRolElegido] = useState(null);

  const params = new URLSearchParams(window.location.search);
  const tokenInvitacion = params.get("invitacion");

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session || null);
      currentUserId = data.session ? data.session.user.id : null;
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, nuevaSession) => {
      setSession(nuevaSession);
      currentUserId = nuevaSession ? nuevaSession.user.id : null;
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setPerfil(undefined); return; }
    (async () => {
      const rolGuardado = tokenInvitacion ? "profe" : (rolElegido || localStorage.getItem("courtclass_rol_pendiente"));
      const p = await obtenerOcrearPerfil(session.user.id, rolGuardado);
      if (tokenInvitacion) {
        await procesarInvitacionPendiente(tokenInvitacion, session.user.id);
        params.delete("invitacion");
        const nuevaUrl = window.location.pathname + (params.toString() ? "?" + params.toString() : "");
        window.history.replaceState({}, "", nuevaUrl);
      }
      localStorage.removeItem("courtclass_rol_pendiente");
      currentUserRol = p ? p.rol : "profe";
      setPerfil(p);
    })();
  }, [session]);

  if (session === undefined || (session && perfil === undefined)) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: COLORS.bg, fontFamily: "system-ui" }}>
        <div style={{ color: COLORS.inkSoft }}>Cargando...</div>
      </div>
    );
  }

  if (recoveryMode && session) {
    return <SetNewPasswordScreen onDone={() => setRecoveryMode(false)} />;
  }

  if (!session) {
    if (!tokenInvitacion && !rolElegido) {
      return <RoleGateScreen onElegir={(r) => { setRolElegido(r); localStorage.setItem("courtclass_rol_pendiente", r); }} />;
    }
    return <LoginScreen onLogged={(s) => { setSession(s); currentUserId = s.user.id; }} />;
  }

  if (perfil && perfil.rol === "club") {
    return (
      <>
        <ClubApp session={session} onOpenAccount={() => setShowAccount(true)} />
        {showAccount && <AccountModal session={session} onClose={() => setShowAccount(false)} />}
      </>
    );
  }

  return (
    <>
      <App key={session.user.id} onOpenAccount={() => setShowAccount(true)} />
      {showAccount && <AccountModal session={session} onClose={() => setShowAccount(false)} />}
    </>
  );
}



const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
